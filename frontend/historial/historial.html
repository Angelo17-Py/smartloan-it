<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%236366f1'/><stop offset='100%25' stop-color='%2300f2ff'/></linearGradient></defs><rect width='100' height='100' rx='22' fill='url(%23g)'/><path d='M50 20 L20 35 L50 50 L80 35 Z' fill='white'/><path d='M20 50 L50 65 L80 50' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/><path d='M20 63 L50 78 L80 63' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/></svg>">
    <title>SmartLoan IT | Historial</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{--primary:#6366f1;--accent:#00f2ff;--warn:#f59e0b;--success:#22c55e;--danger:#ef4444;--bg:#020617;--card:rgba(15,23,42,0.6);--text:#f8fafc;--dim:#94a3b8;--border:rgba(255,255,255,0.08);}
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif;}
        body{background:var(--bg);color:var(--text);min-height:100vh;}
        .glow{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 60% 10%,rgba(167,139,250,0.08) 0%,transparent 40%);z-index:-1;}
        nav{padding:18px 5%;display:flex;justify-content:space-between;align-items:center;background:rgba(2,6,23,0.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
        .brand{font-size:1.3rem;font-weight:800;display:flex;align-items:center;gap:10px;}
        .brand-icon{background:linear-gradient(135deg,var(--primary),var(--accent));width:34px;height:34px;border-radius:10px;display:grid;place-items:center;}
        .back{display:flex;align-items:center;gap:8px;color:var(--dim);text-decoration:none;font-weight:700;font-size:0.85rem;padding:9px 16px;border-radius:10px;border:1px solid var(--border);transition:0.3s;}
        .back:hover{background:rgba(255,255,255,0.05);color:white;}
        main{max-width:1400px;margin:0 auto;padding:40px 28px;}
        .page-header{display:flex;align-items:center;gap:16px;margin-bottom:28px;padding-bottom:22px;border-bottom:1px solid var(--border);}
        .page-icon{width:52px;height:52px;border-radius:14px;background:rgba(167,139,250,0.12);border:1px solid rgba(167,139,250,0.2);display:grid;place-items:center;color:#a78bfa;flex-shrink:0;}
        .page-header h1{font-size:1.8rem;font-weight:800;letter-spacing:-0.5px;}
        .page-header p{color:var(--dim);font-size:0.88rem;margin-top:3px;}
        .toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;margin-bottom:16px;}
        .tabs{display:flex;gap:3px;background:rgba(0,0,0,0.3);padding:4px;border-radius:12px;}
        .tab{padding:9px 22px;border-radius:9px;font-weight:700;font-size:0.85rem;cursor:pointer;transition:0.25s;color:var(--dim);border:none;background:none;font-family:'Plus Jakarta Sans',sans-serif;}
        .tab.active{background:var(--primary);color:white;}
        .filters{display:flex;gap:8px;flex-wrap:wrap;}
        .fb{padding:7px 14px;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:9px;color:var(--dim);font-weight:700;font-size:0.78rem;cursor:pointer;transition:0.25s;font-family:'Plus Jakarta Sans',sans-serif;}
        .fb.active{background:var(--primary);color:white;border-color:var(--primary);}
        .fb:hover:not(.active){background:rgba(255,255,255,0.07);color:white;}
        /* BARRA DE BUSQUEDA */
        .search-bar{background:var(--card);border:1px solid var(--border);border-radius:14px;display:flex;align-items:center;gap:12px;padding:12px 18px;margin-bottom:16px;}
        .search-bar svg{color:var(--dim);flex-shrink:0;}
        .search-bar input{background:none;border:none;color:white;font-size:0.92rem;outline:none;flex:1;font-family:'Plus Jakarta Sans',sans-serif;}
        .search-bar input::placeholder{color:var(--dim);}
        .search-count{font-size:0.78rem;color:var(--dim);white-space:nowrap;font-weight:700;}
        .table-wrap{background:var(--card);backdrop-filter:blur(20px);border-radius:20px;border:1px solid var(--border);overflow-x:auto;}
        .table-header{padding:16px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
        .table-header span{font-size:0.68rem;text-transform:uppercase;letter-spacing:2px;color:var(--dim);font-weight:700;}
        .table-count{background:rgba(167,139,250,0.12);color:#a78bfa;border-radius:20px;padding:3px 10px;font-size:0.73rem;font-weight:800;}
        table{width:100%;border-collapse:collapse;min-width:700px;}
        th{padding:13px 18px;background:rgba(255,255,255,0.02);color:var(--dim);text-transform:uppercase;font-size:0.66rem;letter-spacing:2px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;}
        td{padding:13px 18px;border-bottom:1px solid rgba(255,255,255,0.04);font-size:0.88rem;}
        tr:last-child td{border-bottom:none;}
        tr:hover td{background:rgba(255,255,255,0.02);}
        .badge{padding:3px 10px;border-radius:20px;font-size:0.68rem;font-weight:800;text-transform:uppercase;display:inline-block;}
        .ba{background:rgba(99,102,241,0.12);color:var(--primary);border:1px solid rgba(99,102,241,0.2);}
        .bd{background:rgba(34,197,94,0.1);color:var(--success);border:1px solid rgba(34,197,94,0.18);}
        .bv{background:rgba(239,68,68,0.1);color:var(--danger);border:1px solid rgba(239,68,68,0.18);}
        .code{background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:7px;padding:2px 8px;font-weight:800;font-size:0.8rem;font-family:monospace;}
        .sub-text{font-size:0.78rem;color:var(--dim);margin-top:2px;}
        .em{text-align:center;padding:50px;color:var(--dim);font-size:0.9rem;}
        .highlight{background:rgba(167,139,250,0.15);border-radius:3px;padding:0 2px;}
    </style>
</head>
<body>
<div class="glow"></div>
<nav>
    <div class="brand"><div class="brand-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></div>SmartLoan IT</div>
    <a href="/home/dashboard.html" class="back"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>Dashboard</a>
</nav>
<main>
    <div class="page-header">
        <div class="page-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></div>
        <div><h1>Historial y Trazabilidad</h1><p>Registro completo de todos los movimientos del sistema</p></div>
    </div>
    <div class="toolbar">
        <div class="tabs">
            <button class="tab active" onclick="setTab('p',this)">Prestamos</button>
            <button class="tab" onclick="setTab('d',this)">Devoluciones</button>
        </div>
        <div class="filters" id="filtros">
            <button class="fb active" onclick="setF('todos',this)">Todos</button>
            <button class="fb" onclick="setF('activos',this)">Activos</button>
            <button class="fb" onclick="setF('vencidos',this)">Vencidos</button>
            <button class="fb" onclick="setF('devueltos',this)">Devueltos</button>
        </div>
    </div>
    <div class="search-bar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="busq" placeholder="Buscar por alumno, equipo, codigo, motivo..." oninput="buscar()">
        <span class="search-count" id="search-count"></span>
    </div>
    <div id="tp" class="table-wrap"><div class="em">Cargando...</div></div>
    <div id="td" class="table-wrap" style="display:none"><div class="em">Cargando...</div></div>
</main>
<script>
var API='http://localhost:3000';
if(!localStorage.getItem('encargado')) window.location.href='/';
var prestamos=[],devs=[];
var tabAct='p',filtAct='todos';

function ff(d){if(!d)return'—';return new Date(d).toLocaleString('es-PY',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});}
function fn(n){return Number(n).toLocaleString('es-PY');}

function resaltar(texto,q){
    if(!q||!texto) return texto||'—';
    var re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    return String(texto).replace(re,'<span class="highlight">$1</span>');
}

async function cargar(){
    try{
        var pr=await fetch(API+'/prestamos');
        var dr=await fetch(API+'/devoluciones');
        prestamos=await pr.json();
        devs=await dr.json();
        renderP();renderD();
    }catch(e){
        document.getElementById('tp').innerHTML='<div class="em">Error al cargar datos. Verifica que el servidor este corriendo.</div>';
    }
}

function getPrestFiltrados(){
    var ahora=new Date();
    var d=prestamos.slice();
    if(filtAct==='activos')   d=d.filter(function(p){return p.estado==='ACTIVO'&&new Date(p.fecha_devolucion_estimada)>=ahora;});
    if(filtAct==='vencidos')  d=d.filter(function(p){return p.estado==='ACTIVO'&&new Date(p.fecha_devolucion_estimada)<ahora;});
    if(filtAct==='devueltos') d=d.filter(function(p){return p.estado==='DEVUELTO';});
    var q=document.getElementById('busq').value.trim().toLowerCase();
    if(q){
        d=d.filter(function(p){
            return (p.alumno_nombre&&p.alumno_nombre.toLowerCase().includes(q))||
                   (p.alumno_apellido&&p.alumno_apellido.toLowerCase().includes(q))||
                   (p.codigo_alumno&&p.codigo_alumno.toLowerCase().includes(q))||
                   (p.equipo&&p.equipo.toLowerCase().includes(q))||
                   (p.marca&&p.marca.toLowerCase().includes(q))||
                   (p.motivo&&p.motivo.toLowerCase().includes(q))||
                   (String(p.id_prestamo)===q);
        });
    }
    return d;
}

function getDevFiltrados(){
    var q=document.getElementById('busq').value.trim().toLowerCase();
    if(!q) return devs.slice();
    return devs.filter(function(d){
        return (d.alumno_nombre&&d.alumno_nombre.toLowerCase().includes(q))||
               (d.alumno_apellido&&d.alumno_apellido.toLowerCase().includes(q))||
               (d.codigo_alumno&&d.codigo_alumno.toLowerCase().includes(q))||
               (d.equipo&&d.equipo.toLowerCase().includes(q))||
               (d.tipo_dano&&d.tipo_dano.toLowerCase().includes(q))||
               (String(d.id_prestamo)===q)||
               (String(d.id_devolucion)===q);
    });
}

function renderP(){
    var ahora=new Date();
    var d=getPrestFiltrados();
    var q=document.getElementById('busq').value.trim();
    var w=document.getElementById('tp');
    var header='<div class="table-header"><span>Registro de prestamos</span><span class="table-count">'+d.length+' registros</span></div>';
    if(tabAct==='p') document.getElementById('search-count').textContent=d.length+' resultado'+(d.length!==1?'s':'');
    if(!d.length){w.innerHTML=header+'<div class="em">Sin registros con este criterio</div>';return;}
    var html=header+'<table><thead><tr><th>#</th><th>Alumno</th><th>Equipo</th><th>Fecha prestamo</th><th>Vencimiento</th><th>Motivo</th><th>Estado</th></tr></thead><tbody>';
    d.forEach(function(p){
        var venc=p.estado==='ACTIVO'&&new Date(p.fecha_devolucion_estimada)<ahora;
        var badge=venc?'<span class="badge bv">Vencido</span>':p.estado==='DEVUELTO'?'<span class="badge bd">Devuelto</span>':'<span class="badge ba">Activo</span>';
        html+='<tr>';
        html+='<td><span class="code">#'+p.id_prestamo+'</span></td>';
        html+='<td><strong>'+resaltar(p.codigo_alumno,q)+'</strong><div class="sub-text">'+resaltar(p.alumno_nombre+' '+p.alumno_apellido,q)+'</div><div class="sub-text">'+(p.carrera||'—')+'</div></td>';
        html+='<td><strong>'+resaltar(p.equipo,q)+'</strong><div class="sub-text">'+p.tipo+' &middot; '+p.marca+'</div></td>';
        html+='<td>'+ff(p.fecha_prestamo)+'</td>';
        html+='<td style="'+(venc?'color:var(--danger);font-weight:700':'')+'">'+ff(p.fecha_devolucion_estimada)+'</td>';
        html+='<td style="color:var(--dim);font-size:0.83rem">'+resaltar(p.motivo||'—',q)+'</td>';
        html+='<td>'+badge+'</td>';
        html+='</tr>';
    });
    html+='</tbody></table>';
    w.innerHTML=html;
}

function renderD(){
    var d=getDevFiltrados();
    var q=document.getElementById('busq').value.trim();
    var w=document.getElementById('td');
    var header='<div class="table-header"><span>Registro de devoluciones</span><span class="table-count">'+d.length+' registros</span></div>';
    if(tabAct==='d') document.getElementById('search-count').textContent=d.length+' resultado'+(d.length!==1?'s':'');
    if(!d.length){w.innerHTML=header+'<div class="em">Sin registros con este criterio</div>';return;}
    var html=header+'<table><thead><tr><th>#Dev</th><th>#Pres</th><th>Alumno</th><th>Equipo</th><th>Fecha dev.</th><th>Estado</th><th>Dano</th><th>Multa</th><th>Total</th></tr></thead><tbody>';
    d.forEach(function(dv){
        var danoCell=dv.tiene_dano?'<span style="color:var(--danger);font-weight:700">'+(dv.tipo_dano||'Si')+'</span>':'<span style="color:var(--success)">Sin daños</span>';
        var multaStyle=dv.monto_multa>0?'color:var(--warn);font-weight:700':'color:var(--dim)';
        html+='<tr>';
        html+='<td><span class="code">#'+dv.id_devolucion+'</span></td>';
        html+='<td><span class="code">#'+dv.id_prestamo+'</span></td>';
        html+='<td><strong>'+resaltar(dv.codigo_alumno,q)+'</strong><div class="sub-text">'+resaltar(dv.alumno_nombre+' '+dv.alumno_apellido,q)+'</div></td>';
        html+='<td><strong>'+resaltar(dv.equipo,q)+'</strong><div class="sub-text">'+dv.tipo+'</div></td>';
        html+='<td>'+ff(dv.fecha_devolucion)+'</td>';
        html+='<td>'+dv.estado_equipo+'</td>';
        html+='<td>'+danoCell+'</td>';
        html+='<td style="'+multaStyle+'">'+(dv.dias_retraso>0?dv.dias_retraso+'d &middot; Gs.'+fn(dv.monto_multa):'—')+'</td>';
        html+='<td style="font-weight:800;color:'+(dv.total_cobro>0?'var(--warn)':'var(--dim)')+'">Gs. '+fn(dv.total_cobro||0)+'</td>';
        html+='</tr>';
    });
    html+='</tbody></table>';
    w.innerHTML=html;
}

function buscar(){
    if(tabAct==='p') renderP();
    else renderD();
}

function setTab(t,el){
    tabAct=t;
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});
    el.classList.add('active');
    document.getElementById('tp').style.display=t==='p'?'block':'none';
    document.getElementById('td').style.display=t==='d'?'block':'none';
    document.getElementById('filtros').style.display=t==='p'?'flex':'none';
    document.getElementById('busq').value='';
    document.getElementById('search-count').textContent='';
    if(t==='p') renderP(); else renderD();
}

function setF(f,el){
    filtAct=f;
    document.querySelectorAll('.fb').forEach(function(b){b.classList.remove('active');});
    el.classList.add('active');
    renderP();
}

window.onload=cargar;
</script>
</body>
</html>
