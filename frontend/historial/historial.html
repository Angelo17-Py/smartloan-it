<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SmartLoan IT - Historial y trazabilidad de préstamos y devoluciones de equipos tecnológicos.">
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg?v=3">
    <title>SmartLoan IT | Historial</title>
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/modules.css">
    <script src="/js/utils.js" defer></script>
    <style>
        /* Estilos específicos del historial (las bases comunes están en modules.css) */
        /* Barra de herramientas con pestañas y filtros. */
        .toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:12px}
        /* Pestañas de préstamos, devoluciones y auditoría. */
        .tabs{display:flex;gap:3px;background:var(--surface);padding:4px;border-radius:10px}
        .tab{padding:8px 20px;border-radius:8px;font-weight:700;font-size:var(--text-sm);cursor:pointer;transition:all var(--duration-fast) var(--ease-out);color:var(--dim);border:none;background:none}
        .tab.active{background:var(--primary);color:var(--on-primary)}
        /* Filtros por estado del préstamo. */
        .filters{display:flex;gap:6px;flex-wrap:wrap}
        .fb{padding:6px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--dim);font-weight:700;font-size:var(--text-xs);cursor:pointer;transition:all var(--duration-fast) var(--ease-out)}
        .fb.active{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
        .fb:hover:not(.active){background:var(--surface);color:var(--text);}
        /* Buscador y contador de coincidencias. */
        .search-bar input{font-size:var(--text-sm);}
        .search-count{font-size:var(--text-xs);color:var(--dim);white-space:nowrap;font-weight:700;}
        /* Códigos, textos secundarios y resaltado de la búsqueda. */
        .code{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:2px 7px;font-weight:800;font-size:0.78rem;font-family:var(--mono);color:var(--text);white-space:nowrap;}
        .sub-text{font-size:var(--text-xs);color:var(--dim);margin-top:2px;}
        .em{text-align:center;padding:40px;color:var(--dim);font-size:var(--text-sm);}
        .highlight{background:var(--primary-glow);border-radius:3px;padding:0 2px;}
        /* Botón de eliminación de registros. */
        .btn-del-row{background:none;border:none;color:var(--danger);cursor:pointer;padding:4px 6px;border-radius:6px;font-size:var(--text-xs);font-weight:700;transition:all var(--duration-fast) var(--ease-out);white-space:nowrap;}
        .btn-del-row:hover{background:var(--danger-bg);}

        /* Ajustes responsive de la barra de herramientas y las tablas. */
        @media(max-width:900px){main{padding:20px 16px}}
        @media(max-width:600px){
            main{padding:var(--space-3)!important}
            .toolbar{flex-direction:column;align-items:stretch}
            .tabs{justify-content:center;overflow-x:auto;-webkit-overflow-scrolling:touch}
            .tab{padding:var(--space-2) var(--space-3);font-size:var(--text-xs)}
            .filters{gap:4px}
            .fb{flex:1;text-align:center;padding:var(--space-2) var(--space-2);font-size:var(--text-xs)}
            .search-bar{padding:var(--space-2) var(--space-3);gap:var(--space-2)}
            .search-bar input{font-size:16px!important}
            .breadcrumbs{font-size:var(--text-xs)}
            .page-header{gap:var(--space-3);padding-bottom:var(--space-3)}
            .page-header h1{font-size:var(--text-lg)}
            .page-header p{font-size:var(--text-xs)}
        }
        @media(max-width:480px){
            .toolbar{gap:var(--space-2)}
            .fb{padding:var(--space-1) var(--space-2);font-size:0.65rem}
            .tab{padding:var(--space-1) var(--space-2);font-size:0.65rem}
        }
</style>
</head>
<body>
<!-- Cuerpo de la página -->
<main>
    <!-- Migas de pan (ruta de navegación) -->
    <div class="breadcrumbs"><a href="/home/dashboard.html">Dashboard</a><span class="sep">/</span><span class="current">Historial</span></div>
    <!-- Encabezado de la página -->
    <div class="page-header">
        <div class="page-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></div>
        <div><h1>Historial y Trazabilidad</h1><p>Registro completo de todos los movimientos del sistema</p></div>
    </div>
    <!-- Barra de herramientas con pestañas y filtros -->
    <div class="toolbar reveal">
        <div class="tabs">
            <button class="tab active" onclick="setTab('p',this)">Préstamos</button>
            <button class="tab" onclick="setTab('d',this)">Devoluciones</button>
            <button class="tab" id="tab-aud" onclick="setTab('a',this)" style="display:none">Auditoría</button>
        </div>
        <div class="filters" id="filtros">
            <button class="fb active" onclick="setF('todos',this)">Todos</button>
            <button class="fb" onclick="setF('activos',this)">Activos</button>
            <button class="fb" onclick="setF('vencidos',this)">Vencidos</button>
            <button class="fb" onclick="setF('devueltos',this)">Devueltos</button>
        </div>
    </div>
    <!-- Buscador de registros -->
    <div class="search-bar reveal">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="busq" placeholder="Buscar por alumno, equipo, código, motivo..." oninput="buscar()">
        <span class="search-count" id="search-count"></span>
    </div>
    <!-- Tabla de préstamos -->
    <div id="tp" class="table-wrap reveal"><div class="skeleton-card"><div class="skeleton skeleton-line w80"></div><div class="skeleton skeleton-line w60"></div><div class="skeleton skeleton-line w40"></div><div class="skeleton skeleton-line w70"></div><div class="skeleton skeleton-line w50"></div></div></div>
    <!-- Tabla de devoluciones -->
    <div id="td" class="table-wrap reveal" style="display:none"><div class="skeleton-card"><div class="skeleton skeleton-line w80"></div><div class="skeleton skeleton-line w60"></div><div class="skeleton skeleton-line w40"></div><div class="skeleton skeleton-line w70"></div><div class="skeleton skeleton-line w50"></div></div></div>
    <!-- Tabla de auditoría -->
    <div id="ta" class="table-wrap reveal" style="display:none"><div class="skeleton-card"><div class="skeleton skeleton-line w80"></div><div class="skeleton skeleton-line w60"></div><div class="skeleton skeleton-line w40"></div><div class="skeleton skeleton-line w70"></div><div class="skeleton skeleton-line w50"></div></div></div>
</main>
<!-- Notificación toast para mensajes -->
<div class="toast" id="toast"></div>
<!-- Script de funciones de API -->
<script src="/js/api.js"></script>
<script>
// Verifica la sesión activa; sin encargado se vuelve al login.
if(!localStorage.getItem('encargado')) window.location.href='/';
// Datos recibidos del servidor para las tres tablas.
let prestamos=[],devs=[],auditoria=[];
// Pestaña y filtro seleccionados por el usuario.
let tabAct='p',filtAct='todos';

/** Escapa el texto y resalta de forma segura las coincidencias de la búsqueda. */
function resaltar(texto,q){
    if(!q||!texto) return esc(texto)||'—';
    var re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    return esc(texto).replace(re,'<span class="highlight">$1</span>');
}

/** Descarga préstamos y devoluciones y reconstruye sus tablas. */
async function cargar(){
    try{
        let pr=await apiFetch('/prestamos');
        let dr=await apiFetch('/devoluciones');
        if(!pr.ok||!dr.ok){st('Error al cargar datos','t-err');return;}
        prestamos=await safeJson(pr);
        devs=await safeJson(dr);
        renderP();renderD();
    }catch(e){
        showError(document.getElementById('tp'),{message:'No se pudieron cargar los datos. Verifica la conexi\u00f3n con el servidor.',retry:'cargar()'});
        showError(document.getElementById('td'),{message:'',retry:null});
    }
}

/** Aplica el filtro de estado y la búsqueda de texto a los préstamos. */
function getPrestFiltrados(){
    var ahora=new Date();
    var d=prestamos.slice();
    if(filtAct==='activos')   d=d.filter(function(p){return p.estado==='ACTIVO';});
    if(filtAct==='vencidos')  d=d.filter(function(p){return p.estado==='ACTIVO'&&new Date(p.fecha_devolucion_estimada)<ahora;});
    if(filtAct==='devueltos') d=d.filter(function(p){return p.estado==='DEVUELTO';});
    // La búsqueda ignora mayúsculas y tildes mediante normalizeText.
    var q=normalizeText(document.getElementById('busq').value).trim();
    if(q){
        d=d.filter(function(p){
            return normalizeText(p.alumno_nombre||'').includes(q)||
                   normalizeText(p.alumno_apellido||'').includes(q)||
                   normalizeText(p.codigo_alumno||'').includes(q)||
                   normalizeText(p.equipo||'').includes(q)||
                   normalizeText(p.marca||'').includes(q)||
                   normalizeText(p.motivo||'').includes(q)||
                   (String(p.id_prestamo)===document.getElementById('busq').value.trim())||
                   normalizeText((p.alumno_nombre||'')+' '+(p.alumno_apellido||'')).includes(q)||
                   normalizeText((p.alumno_apellido||'')+' '+(p.alumno_nombre||'')).includes(q)||
                   normalizeText(p.encargado_nombre||'').includes(q)||
                   normalizeText(p.encargado_apellido||'').includes(q)||
                   normalizeText((p.encargado_nombre||'')+' '+(p.encargado_apellido||'')).includes(q)||
                   normalizeText((p.encargado_apellido||'')+' '+(p.encargado_nombre||'')).includes(q);
        });
    }
    return d;
}

/** Filtra las devoluciones por alumno, equipo, daño o intervinientes. */
function getDevFiltrados(){
    var q=normalizeText(document.getElementById('busq').value).trim();
    if(!q) return devs.slice();
    return devs.filter(function(d){
        return normalizeText(d.alumno_nombre||'').includes(q)||
               normalizeText(d.alumno_apellido||'').includes(q)||
               normalizeText(d.codigo_alumno||'').includes(q)||
               normalizeText(d.equipo||'').includes(q)||
               normalizeText(d.tipo_dano||'').includes(q)||
               (String(d.id_prestamo)===document.getElementById('busq').value.trim())||
               (String(d.id_devolucion)===document.getElementById('busq').value.trim())||
               normalizeText((d.alumno_nombre||'')+' '+(d.alumno_apellido||'')).includes(q)||
               normalizeText((d.alumno_apellido||'')+' '+(d.alumno_nombre||'')).includes(q)||
               normalizeText(d.enc_prestamo_nombre||'').includes(q)||
               normalizeText(d.enc_prestamo_apellido||'').includes(q)||
               normalizeText((d.enc_prestamo_nombre||'')+' '+(d.enc_prestamo_apellido||'')).includes(q)||
               normalizeText((d.enc_prestamo_apellido||'')+' '+(d.enc_prestamo_nombre||'')).includes(q)||
               normalizeText(d.enc_devolucion_nombre||'').includes(q)||
               normalizeText(d.enc_devolucion_apellido||'').includes(q)||
               normalizeText((d.enc_devolucion_nombre||'')+' '+(d.enc_devolucion_apellido||'')).includes(q)||
               normalizeText((d.enc_devolucion_apellido||'')+' '+(d.enc_devolucion_nombre||'')).includes(q);
    });
}

/** Genera la tabla de préstamos con su estado y resaltado de búsqueda. */
function renderP(){
    var ahora=new Date();
    var d=getPrestFiltrados();
    var q=document.getElementById('busq').value.trim();
    var w=document.getElementById('tp');
    var header='<div class="table-header"><span>Registro de préstamos</span><span class="table-count">'+d.length+' registros</span></div>';
    if(tabAct==='p') document.getElementById('search-count').textContent=d.length+' resultado'+(d.length!==1?'s':'');
    if(!d.length){w.innerHTML=header+'<div class="em">Sin registros con este criterio</div>';return;}
    var html=header+'<table style="width:100%"><thead><tr><th scope="col">#</th><th scope="col">Alumno</th><th scope="col">Equipo</th><th scope="col">Fecha préstamo</th><th scope="col">Vencimiento</th><th scope="col">Encargado</th><th scope="col">Motivo</th><th scope="col">Estado</th></tr></thead><tbody>';
    d.forEach(function(p,i){
        // Un préstamo activo cuya fecha estimada ya pasó se muestra vencido.
        var venc=p.estado==='ACTIVO'&&new Date(p.fecha_devolucion_estimada)<ahora;
        var badge=venc?'<span class="badge badge-danger">Vencido</span>':p.estado==='DEVUELTO'?'<span class="badge badge-success">Devuelto</span>':'<span class="badge badge-primary">Activo</span>';
        var sc='animate-fi-'+Math.min(i+1,10);
        html+='<tr class="'+sc+'">';
        html+='<td data-label="#"><span class="code">'+(p.codigo_prestamo||'#'+p.id_prestamo)+'</span></td>';
        html+='<td data-label="Alumno"><strong>'+resaltar(p.codigo_alumno,q)+'</strong><div class="sub-text">'+resaltar(p.alumno_nombre+' '+p.alumno_apellido,q)+'</div><div class="sub-text">'+(p.carrera||'—')+' · '+(p.curso||'—')+' · '+(p.turno||'—')+'</div></td>';
        html+='<td data-label="Equipo"><strong>'+resaltar(p.equipo,q)+'</strong><div class="sub-text">'+p.tipo+' &middot; '+p.marca+'</div></td>';
        html+='<td data-label="Préstamo">'+ff(p.fecha_prestamo)+'</td>';
        html+='<td data-label="Vence" style="'+(venc?'color:var(--danger);font-weight:700':'')+'">'+ff(p.fecha_devolucion_estimada)+'</td>';
        html+='<td data-label="Encargado" style="color:var(--dim);font-size:0.82rem">'+resaltar((p.encargado_nombre||'')+' '+(p.encargado_apellido||''),q)+'</td>';
        html+='<td data-label="Motivo" style="color:var(--dim);font-size:0.82rem">'+resaltar(p.motivo||'—',q)+'</td>';
        html+='<td data-label="Estado">'+badge+'</td>';
        html+='</tr>';
    });
    html+='</tbody></table>';
    w.innerHTML=html;
}

/** Genera la tabla de devoluciones con daños, multas y total cobrado. */
function renderD(){
    var d=getDevFiltrados();
    var q=document.getElementById('busq').value.trim();
    var w=document.getElementById('td');
    var header='<div class="table-header"><span>Registro de devoluciones</span><span class="table-count">'+d.length+' registros</span></div>';
    if(tabAct==='d') document.getElementById('search-count').textContent=d.length+' resultado'+(d.length!==1?'s':'');
    if(!d.length){w.innerHTML=header+'<div class="em">Sin registros con este criterio</div>';return;}
    var html=header+'<table style="width:100%"><thead><tr><th scope="col">#Dev</th><th scope="col">#Pres</th><th scope="col">Alumno</th><th scope="col">Equipo</th><th scope="col">Fecha dev.</th><th scope="col">Registró</th><th scope="col">Recibió</th><th scope="col">Estado</th><th scope="col">Daño</th><th scope="col">Multa</th><th scope="col">Total</th></tr></thead><tbody>';
    d.forEach(function(dv,i){
        var danoCell=dv.tiene_dano?'<span style="color:var(--danger);font-weight:700">'+(dv.tipo_dano||'Si')+'</span>':'<span style="color:var(--success)">Sin daños</span>';
        var multaStyle=dv.monto_multa>0?'color:var(--warn);font-weight:700':'color:var(--dim)';
        var sc='animate-fi-'+Math.min(i+1,10);
        html+='<tr class="'+sc+'">';
        html+='<td data-label="#Dev"><span class="code">'+(dv.codigo_prestamo||'#'+dv.id_devolucion)+'</span></td>';
        html+='<td data-label="#Pres"><span class="code">'+(dv.codigo_prestamo||'#'+dv.id_prestamo)+'</span></td>';
        html+='<td data-label="Alumno"><strong>'+resaltar(dv.codigo_alumno,q)+'</strong><div class="sub-text">'+resaltar(dv.alumno_nombre+' '+dv.alumno_apellido,q)+'</div></td>';
        html+='<td data-label="Equipo"><strong>'+resaltar(dv.equipo,q)+'</strong><div class="sub-text">'+dv.tipo+'</div></td>';
        html+='<td data-label="Devuelto">'+ff(dv.fecha_devolucion)+'</td>';
        html+='<td data-label="Registró" style="color:var(--dim);font-size:0.82rem">'+resaltar((dv.enc_prestamo_nombre||'')+' '+(dv.enc_prestamo_apellido||''),q)+'</td>';
        html+='<td data-label="Recibió" style="color:var(--dim);font-size:0.82rem">'+resaltar((dv.enc_devolucion_nombre||'')+' '+(dv.enc_devolucion_apellido||''),q)+'</td>';
        html+='<td data-label="Estado">'+dv.estado_equipo+'</td>';
        html+='<td data-label="Daño">'+danoCell+'</td>';
        html+='<td data-label="Multa" style="'+multaStyle+'">'+(dv.dias_retraso>0?dv.dias_retraso+'d &middot; Gs.'+fn(dv.monto_multa):'—')+'</td>';
        html+='<td data-label="Total" style="font-weight:800;color:'+(dv.total_cobro>0?'var(--warn)':'var(--dim)')+'">Gs. '+fn(dv.total_cobro||0)+'</td>';
        html+='</tr>';
    });
    html+='</tbody></table>';
    w.innerHTML=html;
}

/** Carga el registro de auditoría; solo se invoca para administradores. */
async function cargarAuditoria(){
    try{
        var r=await apiFetch('/auditoria');
        if(!r.ok) return;
        auditoria=await safeJson(r);
        renderA();
    }catch(e){}
}

/** Filtra la auditoría por usuario, acción, módulo o detalle. */
function getAudFiltrados(){
    var q=normalizeText(document.getElementById('busq').value).trim();
    if(!q) return auditoria.slice();
    return auditoria.filter(function(a){
        return normalizeText((a.encargado_nombre||'')+' '+(a.encargado_apellido||'')).includes(q)||
               normalizeText(a.codigo_encargado||'').includes(q)||
               normalizeText(a.accion||'').includes(q)||
               normalizeText(a.entidad||'').includes(q)||
               normalizeText(a.id_entidad||'').includes(q)||
               normalizeText(a.detalle||'').includes(q);
    });
}

/** Genera la tabla de auditoría y traduce acciones y módulos. */
function renderA(){
    var d=getAudFiltrados();
    var q=document.getElementById('busq').value.trim();
    var w=document.getElementById('ta');
    var header='<div class="table-header"><span>Registro de auditoría</span><span class="table-count">'+d.length+' registros</span></div>';
    if(tabAct==='a') document.getElementById('search-count').textContent=d.length+' resultado'+(d.length!==1?'s':'');
    if(!d.length){w.innerHTML=header+'<div class="em">Sin registros con este criterio</div>';return;}
    // Color del badge por acción y nombre legible del módulo.
    var map={'CREAR':'badge-success','ELIMINAR':'badge-danger','EDITAR':'badge-warn','ESTADO':'badge-warn','DESACTIVAR':'badge-danger','ACTIVAR':'badge-success','LOGIN':'badge-info'};
    var modulos={'sesion':'Sesión','alumno':'Alumno','equipo':'Equipo','prestamo':'Préstamo','devolucion':'Devolución','usuario':'Usuario','configuracion':'Configuración'};
    var html=header+'<table style="width:100%"><thead><tr><th scope="col">Fecha y hora</th><th scope="col">Usuario</th><th scope="col">Acción</th><th scope="col">Módulo</th><th scope="col">Detalle</th></tr></thead><tbody>';
    d.forEach(function(a,i){
        var cls=map[a.accion]||'badge-primary';
        var sc='animate-fi-'+Math.min(i+1,10);
        var usuario=((a.encargado_nombre||'')+' '+(a.encargado_apellido||'')).trim()||a.codigo_encargado||'Sistema';
        html+='<tr class="'+sc+'">';
        html+='<td data-label="Fecha">'+ff(a.fecha)+'</td>';
        html+='<td data-label="Usuario"><strong>'+resaltar(usuario,q)+'</strong>'+(a.codigo_encargado?'<div class="sub-text">Código: '+esc(a.codigo_encargado)+'</div>':'')+'</td>';
        html+='<td data-label="Acción"><span class="badge '+cls+'">'+esc(a.accion)+'</span></td>';
        html+='<td data-label="Módulo">'+resaltar(modulos[a.entidad]||a.entidad||'—',q)+'</td>';
        html+='<td data-label="Detalle" style="color:var(--dim);font-size:0.82rem">'+resaltar(a.detalle||'—',q)+'</td>';
        html+='</tr>';
    });
    html+='</tbody></table>';
    w.innerHTML=html;
}

/** Vuelve a renderizar la tabla de la pestaña activa al buscar. */
function buscar(){
    if(tabAct==='p') renderP();
    else if(tabAct==='d') renderD();
    else renderA();
}

/** Cambia de pestaña, adapta el buscador y anima la tabla visible. */
function setTab(t,el){
    tabAct=t;
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});
    el.classList.add('active');
    // Mostramos la tabla correspondiente y ocultamos las demás
    var tp=document.getElementById('tp'),td=document.getElementById('td'),ta=document.getElementById('ta');
    tp.style.display=t==='p'?'block':'none';
    td.style.display=t==='d'?'block':'none';
    ta.style.display=t==='a'?'block':'none';
    // Fuerza el reinicio de la animación de entrada de la tabla elegida.
    if(t==='p'){tp.style.animation='none';void tp.offsetWidth;tp.style.animation='fi 0.35s var(--ease-out) both';}
    else if(t==='d'){td.style.animation='none';void td.offsetWidth;td.style.animation='fi 0.35s var(--ease-out) both';}
    else{ta.style.animation='none';void ta.offsetWidth;ta.style.animation='fi 0.35s var(--ease-out) both';}
    document.getElementById('filtros').style.display=t==='p'?'flex':'none';
    var busq=document.getElementById('busq');
    if(t==='a') busq.placeholder='Buscar por usuario, acción, módulo o detalle...';
    else if(t==='d') busq.placeholder='Buscar por alumno, equipo, código o daño...';
    else busq.placeholder='Buscar por alumno, equipo, código, motivo...';
    if(t==='p') renderP();
    else if(t==='d') renderD();
    else renderA();
}

/** Aplica el filtro de estado elegido y repinta los préstamos. */
function setF(f,el){
    filtAct=f;
    document.querySelectorAll('.fb').forEach(function(b){b.classList.remove('active');});
    el.classList.add('active');
    renderP();
}

// Eliminación de registros con confirmación previa.
/** Confirma y elimina un préstamo junto con sus datos asociados. */
function eliminarPrestamo(id){
    showConfirm('Eliminar el pr\u00e9stamo #'+id+'\n\nSe borrar\u00e1n todos los datos asociados (incluyendo devoluci\u00f3n si existe).\nEsta acci\u00f3n no se puede deshacer.',function(){
    apiFetch('/prestamos/'+id,{method:'DELETE'}).then(function(r){
        if(r.ok){st('Préstamo eliminado');cargar();}
        else{safeJson(r).then(function(d){st(d.mensaje||'Error','t-err');});}
    }).catch(function(){st('Error de conexión','t-err');});
    });
}
/** Confirma y elimina una devolución, reactivando el préstamo y el equipo. */
function eliminarDevolucion(id){
    showConfirm('Eliminar la devoluci\u00f3n #'+id+'\n\nEl pr\u00e9stamo se reactivar\u00e1 y el equipo volver\u00e1 a estar disponible.\nEsta acci\u00f3n no se puede deshacer.',function(){
    apiFetch('/devoluciones/'+id,{method:'DELETE'}).then(function(r){
        if(r.ok){st('Devolución eliminada');cargar();}
        else{safeJson(r).then(function(d){st(d.mensaje||'Error','t-err');});}
    }).catch(function(){st('Error de conexión','t-err');});
    });
}
