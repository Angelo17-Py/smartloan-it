<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SmartLoan IT - Historial y trazabilidad de préstamos y devoluciones de equipos tecnológicos.">
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <title>SmartLoan IT | Historial</title>
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/components.css">
    <script src="/js/utils.js" defer></script>
    <style>
        /* Estilos del historial */
        /* Contenedor principal de la página */
        main{max-width:1400px;margin:0 auto;padding:40px 28px}
        /* Barra de herramientas */
        .toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;margin-bottom:16px}
        /* Pestañas (préstamos/devoluciones) */
        .tabs{display:flex;gap:3px;background:var(--surface);padding:4px;border-radius:10px}
        .tab{padding:8px 20px;border-radius:8px;font-weight:700;font-size:0.82rem;cursor:pointer;transition:all var(--duration-fast) var(--ease-out);color:var(--dim);border:none;background:none}
        .tab.active{background:var(--primary);color:white}
        /* Filtros de estado */
        .filters{display:flex;gap:6px;flex-wrap:wrap}
        /* Botón individual de filtro */
        .fb{padding:6px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--dim);font-weight:700;font-size:0.75rem;cursor:pointer;transition:all var(--duration-fast) var(--ease-out)}
        .fb.active{background:var(--primary);color:white;border-color:var(--primary)}
        .fb:hover:not(.active){background:var(--surface);color:var(--text);}
        /* Barra de búsqueda */
        .search-bar{background:var(--surface);border:1px solid var(--border);border-radius:12px;display:flex;align-items:center;gap:12px;padding:10px 16px;margin-bottom:16px;}
        .search-bar svg{color:var(--dim);flex-shrink:0;}
        .search-bar input{background:none;border:none;color:var(--text);font-size:0.9rem;outline:none;flex:1;padding:0;}
        .search-bar input::placeholder{color:var(--dim);}
        .search-count{font-size:0.75rem;color:var(--dim);white-space:nowrap;font-weight:700;}
        /* Tabla de resultados */
        .table-wrap{border-radius:14px;overflow:hidden;}
        .table-header{padding:14px 22px;display:flex;justify-content:space-between;align-items:center;}
        .table-header span{font-size:0.68rem;letter-spacing:2px;font-weight:700;color:var(--dim);}
        .table-count{background:var(--primary-glow);color:var(--primary);border-radius:20px;padding:3px 10px;font-size:0.72rem;font-weight:800;}
        /* Estilo de encabezados de tabla */
        th{padding:12px 18px;font-size:0.66rem;letter-spacing:1.5px;color:var(--muted);font-weight:700;text-transform:uppercase;}
        /* Estilo de celdas de tabla */
        td{padding:12px 18px;font-size:0.86rem;border-bottom:1px solid var(--border);vertical-align:middle;}
        /* Código ID del registro */
        .code{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:2px 7px;font-weight:800;font-size:0.78rem;font-family:monospace;color:var(--text);white-space:nowrap;}
        /* Texto secundario (debajo del principal) */
        .sub-text{font-size:0.75rem;color:var(--dim);margin-top:2px;}
        /* Mensaje cuando no hay resultados */
        .em{text-align:center;padding:40px;color:var(--dim);font-size:0.88rem;}
        /* Resaltado del texto buscado */
        .highlight{background:var(--primary-glow);border-radius:3px;padding:0 2px;}
        /* Botón para eliminar una fila */
        .btn-del-row{background:none;border:none;color:var(--danger);cursor:pointer;padding:4px 6px;border-radius:6px;font-size:0.72rem;font-weight:700;transition:all var(--duration-fast) var(--ease-out);white-space:nowrap;}
        .btn-del-row:hover{background:var(--danger-bg);}
        /* Columna de acciones (botón eliminar) */
        th.ac{width:52px;}
        @media(max-width:600px){
            main{padding:var(--space-3)!important}
            .toolbar{flex-direction:column;align-items:stretch}
            .tabs{justify-content:center;overflow-x:auto;-webkit-overflow-scrolling:touch}
            .tab{padding:var(--space-2) var(--space-3);font-size:var(--text-xs)}
            .filters{gap:4px}
            .fb{flex:1;text-align:center;padding:var(--space-2) var(--space-2);font-size:0.65rem}
            .search-bar{padding:var(--space-2) var(--space-3);gap:var(--space-2)}
            .search-bar input{font-size:16px!important}
            .breadcrumbs{font-size:var(--text-xs)}
            .page-header{gap:var(--space-3);padding-bottom:var(--space-3)}
            .page-header h1{font-size:var(--text-lg)}
            .page-header p{font-size:var(--text-xs)}
        }
</style>
</head>
<body>
<!-- Cuerpo de la página -->
<!-- Barra de navegación principal -->
<nav class="nav">
    <a href="/home/dashboard.html" class="brand"><div class="brand-icon"><svg width="18" height="18" viewBox="0 0 100 100" fill="none"><rect x="8" y="14" width="84" height="56" rx="10" fill="none" stroke="white" stroke-width="6"/><path d="M38 70 L38 82 L62 82 L62 70" fill="none" stroke="white" stroke-width="5" stroke-linejoin="round" opacity="0.6"/><rect x="34" y="82" width="32" height="5" rx="2.5" fill="white" opacity="0.4"/><path d="M24 44 L38 32 L52 40 L66 26 L78 34" fill="none" stroke="white" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="78" cy="34" r="4" fill="white"/></svg></div>SmartLoan IT</a>
    <div class="nav-right">
        <div class="nav-user" id="navUser" style="display:none">
            <div class="avatar" id="navAvatar">A</div>
            <span class="nav-user-name" id="navName">Cargando...</span>
        </div>
        <button class="btn-icon" onclick="toggleTheme()" title="Cambiar tema" aria-label="Cambiar tema">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button class="btn-logout" onclick="logout()" title="Salir" aria-label="Salir"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
        <a href="/home/dashboard.html" class="nav-link"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>Dashboard</a>
    </div>
</nav>
<main>
    <!-- Migas de pan (ruta de navegación) -->
    <div class="breadcrumbs"><a href="/home/dashboard.html">Dashboard</a><span class="sep">/</span><span class="current">Historial</span></div>
    <!-- Encabezado de la página -->
    <div class="page-header">
        <div class="page-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></div>
        <div><h1>Historial y Trazabilidad</h1><p>Registro completo de todos los movimientos del sistema</p></div>
    </div>
    <!-- Barra de herramientas con pestañas y filtros -->
    <div class="toolbar">
        <div class="tabs">
            <button class="tab active" onclick="setTab('p',this)">Préstamos</button>
            <button class="tab" onclick="setTab('d',this)">Devoluciones</button>
        </div>
        <div class="filters" id="filtros">
            <button class="fb active" onclick="setF('todos',this)">Todos</button>
            <button class="fb" onclick="setF('activos',this)">Activos</button>
            <button class="fb" onclick="setF('vencidos',this)">Vencidos</button>
            <button class="fb" onclick="setF('devueltos',this)">Devueltos</button>
        </div>
    </div>
    <!-- Buscador de registros -->
    <div class="search-bar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="busq" placeholder="Buscar por alumno, equipo, código, motivo..." oninput="buscar()">
        <span class="search-count" id="search-count"></span>
    </div>
    <!-- Tabla de préstamos -->
    <div id="tp" class="table-wrap"><div class="skeleton-card"><div class="skeleton skeleton-line w80"></div><div class="skeleton skeleton-line w60"></div><div class="skeleton skeleton-line w40"></div><div class="skeleton skeleton-line w70"></div><div class="skeleton skeleton-line w50"></div></div></div>
    <!-- Tabla de devoluciones -->
    <div id="td" class="table-wrap" style="display:none"><div class="skeleton-card"><div class="skeleton skeleton-line w80"></div><div class="skeleton skeleton-line w60"></div><div class="skeleton skeleton-line w40"></div><div class="skeleton skeleton-line w70"></div><div class="skeleton skeleton-line w50"></div></div></div>
</main>
<!-- Notificación toast para mensajes -->
<div class="toast" id="toast"></div>
<!-- Script de funciones de API -->
<script src="/js/api.js"></script>
<script>
// Verificamos si el usuario inició sesión
if(!localStorage.getItem('encargado')) window.location.href='/';
// Guardamos todos los préstamos y devoluciones que vienen del servidor
let prestamos=[],devs=[];
// Controlamos qué pestaña está activa y qué filtro
let tabAct='p',filtAct='todos';

// Resaltamos el texto que el usuario buscó dentro de los resultados
function resaltar(texto,q){
    if(!q||!texto) return esc(texto)||'—';
    var re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    return esc(texto).replace(re,'<span class="highlight">$1</span>');
}

// Cargamos los préstamos y devoluciones desde el servidor
async function cargar(){
    try{
        let pr=await apiFetch('/prestamos');
        let dr=await apiFetch('/devoluciones');
        if(!pr.ok||!dr.ok){st('Error al cargar datos','t-err');return;}
        prestamos=await safeJson(pr);
        devs=await safeJson(dr);
        renderP();renderD();
    }catch(e){
        showError(document.getElementById('tp'),{message:'No se pudieron cargar los datos. Verifica la conexi\u00f3n con el servidor.',retry:'cargar()'});
        showError(document.getElementById('td'),{message:'',retry:null});
    }
}

// Filtramos los préstamos según la pestaña activa (todos/activos/vencidos/devueltos)
function getPrestFiltrados(){
    var ahora=new Date();
    var d=prestamos.slice();
    if(filtAct==='activos')   d=d.filter(function(p){return p.estado==='ACTIVO';});
    if(filtAct==='vencidos')  d=d.filter(function(p){return p.estado==='ACTIVO'&&new Date(p.fecha_devolucion_estimada)<ahora;});
    if(filtAct==='devueltos') d=d.filter(function(p){return p.estado==='DEVUELTO';});
    // También filtramos por lo que el usuario escribió en el buscador
    var q=normalizeText(document.getElementById('busq').value).trim();
    if(q){
        d=d.filter(function(p){
            return normalizeText(p.alumno_nombre||'').includes(q)||
                   normalizeText(p.alumno_apellido||'').includes(q)||
                   normalizeText(p.codigo_alumno||'').includes(q)||
                   normalizeText(p.equipo||'').includes(q)||
                   normalizeText(p.marca||'').includes(q)||
                   normalizeText(p.motivo||'').includes(q)||
                   (String(p.id_prestamo)===document.getElementById('busq').value.trim())||
                   normalizeText((p.alumno_nombre||'')+' '+(p.alumno_apellido||'')).includes(q)||
                   normalizeText((p.alumno_apellido||'')+' '+(p.alumno_nombre||'')).includes(q)||
                   normalizeText(p.encargado_nombre||'').includes(q)||
                   normalizeText(p.encargado_apellido||'').includes(q)||
                   normalizeText((p.encargado_nombre||'')+' '+(p.encargado_apellido||'')).includes(q)||
                   normalizeText((p.encargado_apellido||'')+' '+(p.encargado_nombre||'')).includes(q);
        });
    }
    return d;
}

// Filtramos las devoluciones por el texto de búsqueda
function getDevFiltrados(){
    var q=normalizeText(document.getElementById('busq').value).trim();
    if(!q) return devs.slice();
    return devs.filter(function(d){
        return normalizeText(d.alumno_nombre||'').includes(q)||
               normalizeText(d.alumno_apellido||'').includes(q)||
               normalizeText(d.codigo_alumno||'').includes(q)||
               normalizeText(d.equipo||'').includes(q)||
               normalizeText(d.tipo_dano||'').includes(q)||
               (String(d.id_prestamo)===document.getElementById('busq').value.trim())||
               (String(d.id_devolucion)===document.getElementById('busq').value.trim())||
               normalizeText((d.alumno_nombre||'')+' '+(d.alumno_apellido||'')).includes(q)||
               normalizeText((d.alumno_apellido||'')+' '+(d.alumno_nombre||'')).includes(q)||
               normalizeText(d.enc_prestamo_nombre||'').includes(q)||
               normalizeText(d.enc_prestamo_apellido||'').includes(q)||
               normalizeText((d.enc_prestamo_nombre||'')+' '+(d.enc_prestamo_apellido||'')).includes(q)||
               normalizeText((d.enc_prestamo_apellido||'')+' '+(d.enc_prestamo_nombre||'')).includes(q)||
               normalizeText(d.enc_devolucion_nombre||'').includes(q)||
               normalizeText(d.enc_devolucion_apellido||'').includes(q)||
               normalizeText((d.enc_devolucion_nombre||'')+' '+(d.enc_devolucion_apellido||'')).includes(q)||
               normalizeText((d.enc_devolucion_apellido||'')+' '+(d.enc_devolucion_nombre||'')).includes(q);
    });
}

// Mostramos la tabla de préstamos
function renderP(){
    var ahora=new Date();
    var d=getPrestFiltrados();
    var q=document.getElementById('busq').value.trim();
    var w=document.getElementById('tp');
    var header='<div class="table-header"><span>Registro de préstamos</span><span class="table-count">'+d.length+' registros</span></div>';
    if(tabAct==='p') document.getElementById('search-count').textContent=d.length+' resultado'+(d.length!==1?'s':'');
    if(!d.length){w.innerHTML=header+'<div class="em">Sin registros con este criterio</div>';return;}
    var html=header+'<table><thead><tr><th scope="col">#</th><th scope="col">Alumno</th><th scope="col">Equipo</th><th scope="col">Fecha préstamo</th><th scope="col">Vencimiento</th><th scope="col">Encargado</th><th scope="col">Motivo</th><th scope="col">Estado</th><th scope="col" class="ac"></th></tr></thead><tbody>';
    d.forEach(function(p,i){
        // Calculamos si cada préstamo está vencido
        var venc=p.estado==='ACTIVO'&&new Date(p.fecha_devolucion_estimada)<ahora;
        var badge=venc?'<span class="badge badge-danger">Vencido</span>':p.estado==='DEVUELTO'?'<span class="badge badge-success">Devuelto</span>':'<span class="badge badge-primary">Activo</span>';
        var sc='animate-fi-'+Math.min(i+1,10);
        html+='<tr class="'+sc+'">';
        html+='<td data-label="#"><span class="code">#'+p.id_prestamo+'</span></td>';
        html+='<td data-label="Alumno"><strong>'+resaltar(p.codigo_alumno,q)+'</strong><div class="sub-text">'+resaltar(p.alumno_nombre+' '+p.alumno_apellido,q)+'</div><div class="sub-text">'+(p.carrera||'—')+'</div></td>';
        html+='<td data-label="Equipo"><strong>'+resaltar(p.equipo,q)+'</strong><div class="sub-text">'+p.tipo+' &middot; '+p.marca+'</div></td>';
        html+='<td data-label="Préstamo">'+ff(p.fecha_prestamo)+'</td>';
        html+='<td data-label="Vence" style="'+(venc?'color:var(--danger);font-weight:700':'')+'">'+ff(p.fecha_devolucion_estimada)+'</td>';
        html+='<td data-label="Encargado" style="color:var(--dim);font-size:0.82rem">'+resaltar((p.encargado_nombre||'')+' '+(p.encargado_apellido||''),q)+'</td>';
        html+='<td data-label="Motivo" style="color:var(--dim);font-size:0.82rem">'+resaltar(p.motivo||'—',q)+'</td>';
        html+='<td data-label="Estado">'+badge+'</td>';
        html+='<td data-label="">'+(esAdmin()?'<button class="btn-del-row" onclick="eliminarPrestamo('+p.id_prestamo+')" title="Eliminar préstamo">✕</button>':'')+'</td>';
        html+='</tr>';
    });
    html+='</tbody></table>';
    w.innerHTML=html;
}

// Mostramos la tabla de devoluciones
function renderD(){
    var d=getDevFiltrados();
    var q=document.getElementById('busq').value.trim();
    var w=document.getElementById('td');
    var header='<div class="table-header"><span>Registro de devoluciones</span><span class="table-count">'+d.length+' registros</span></div>';
    if(tabAct==='d') document.getElementById('search-count').textContent=d.length+' resultado'+(d.length!==1?'s':'');
    if(!d.length){w.innerHTML=header+'<div class="em">Sin registros con este criterio</div>';return;}
    var html=header+'<table><thead><tr><th scope="col">#Dev</th><th scope="col">#Pres</th><th scope="col">Alumno</th><th scope="col">Equipo</th><th scope="col">Fecha dev.</th><th scope="col">Registró</th><th scope="col">Recibió</th><th scope="col">Estado</th><th scope="col">Daño</th><th scope="col">Multa</th><th scope="col">Total</th><th scope="col" class="ac"></th></tr></thead><tbody>';
    d.forEach(function(dv,i){
        var danoCell=dv.tiene_dano?'<span style="color:var(--danger);font-weight:700">'+(dv.tipo_dano||'Si')+'</span>':'<span style="color:var(--success)">Sin daños</span>';
        var multaStyle=dv.monto_multa>0?'color:var(--warn);font-weight:700':'color:var(--dim)';
        var sc='animate-fi-'+Math.min(i+1,10);
        html+='<tr class="'+sc+'">';
        html+='<td data-label="#Dev"><span class="code">#'+dv.id_devolucion+'</span></td>';
        html+='<td data-label="#Pres"><span class="code">#'+dv.id_prestamo+'</span></td>';
        html+='<td data-label="Alumno"><strong>'+resaltar(dv.codigo_alumno,q)+'</strong><div class="sub-text">'+resaltar(dv.alumno_nombre+' '+dv.alumno_apellido,q)+'</div></td>';
        html+='<td data-label="Equipo"><strong>'+resaltar(dv.equipo,q)+'</strong><div class="sub-text">'+dv.tipo+'</div></td>';
        html+='<td data-label="Devuelto">'+ff(dv.fecha_devolucion)+'</td>';
        html+='<td data-label="Registró" style="color:var(--dim);font-size:0.82rem">'+resaltar((dv.enc_prestamo_nombre||'')+' '+(dv.enc_prestamo_apellido||''),q)+'</td>';
        html+='<td data-label="Recibió" style="color:var(--dim);font-size:0.82rem">'+resaltar((dv.enc_devolucion_nombre||'')+' '+(dv.enc_devolucion_apellido||''),q)+'</td>';
        html+='<td data-label="Estado">'+dv.estado_equipo+'</td>';
        html+='<td data-label="Daño">'+danoCell+'</td>';
        html+='<td data-label="Multa" style="'+multaStyle+'">'+(dv.dias_retraso>0?dv.dias_retraso+'d &middot; Gs.'+fn(dv.monto_multa):'—')+'</td>';
        html+='<td data-label="Total" style="font-weight:800;color:'+(dv.total_cobro>0?'var(--warn)':'var(--dim)')+'">Gs. '+fn(dv.total_cobro||0)+'</td>';
        html+='<td data-label="">'+(esAdmin()?'<button class="btn-del-row" onclick="eliminarDevolucion('+dv.id_devolucion+')" title="Eliminar devolución">✕</button>':'')+'</td>';
        html+='</tr>';
    });
    html+='</tbody></table>';
    w.innerHTML=html;
}

// Ejecutamos la búsqueda cada vez que el usuario escribe
function buscar(){
    if(tabAct==='p') renderP();
    else renderD();
}

// Cambiamos entre la pestaña de préstamos y la de devoluciones
function setTab(t,el){
    tabAct=t;
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});
    el.classList.add('active');
    // Mostramos la taba correspondiente y ocultamos la otra
    var tp=document.getElementById('tp'),td=document.getElementById('td');
    tp.style.display=t==='p'?'block':'none';
    td.style.display=t==='d'?'block':'none';
    if(t==='p'){tp.style.animation='none';void tp.offsetWidth;tp.style.animation='fi 0.35s var(--ease-out) both';}
    else{td.style.animation='none';void td.offsetWidth;td.style.animation='fi 0.35s var(--ease-out) both';}
    document.getElementById('filtros').style.display=t==='p'?'flex':'none';
    if(t==='p') renderP(); else renderD();
}

// Cambiamos el filtro (todos, activos, vencidos, devueltos)
function setF(f,el){
    filtAct=f;
    document.querySelectorAll('.fb').forEach(function(b){b.classList.remove('active');});
    el.classList.add('active');
    renderP();
}

// Confirmamos y eliminamos un préstamo
function eliminarPrestamo(id){
    showConfirm('Eliminar el pr\u00e9stamo #'+id+'\n\nSe borrar\u00e1n todos los datos asociados (incluyendo devoluci\u00f3n si existe).\nEsta acci\u00f3n no se puede deshacer.',function(){
    apiFetch('/prestamos/'+id,{method:'DELETE'}).then(function(r){
        if(r.ok){st('Préstamo eliminado');cargar();}
        else{safeJson(r).then(function(d){st(d.mensaje||'Error','t-err');});}
    }).catch(function(){st('Error de conexión','t-err');});
    });
}
// Confirmamos y eliminamos una devolución
function eliminarDevolucion(id){
    showConfirm('Eliminar la devoluci\u00f3n #'+id+'\n\nEl pr\u00e9stamo se reactivar\u00e1 y el equipo volver\u00e1 a estar disponible.\nEsta acci\u00f3n no se puede deshacer.',function(){
    apiFetch('/devoluciones/'+id,{method:'DELETE'}).then(function(r){
        if(r.ok){st('Devolución eliminada');cargar();}
        else{safeJson(r).then(function(d){st(d.mensaje||'Error','t-err');});}
    }).catch(function(){st('Error de conexión','t-err');});
    });
}
