<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%236366f1'/><stop offset='100%25' stop-color='%2300f2ff'/></linearGradient></defs><rect width='100' height='100' rx='22' fill='url(%23g)'/><path d='M50 20 L20 35 L50 50 L80 35 Z' fill='white'/><path d='M20 50 L50 65 L80 50' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/><path d='M20 63 L50 78 L80 63' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/></svg>">
    <title>SmartLoan IT | Historial</title>
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/components.css">
    <script src="/js/utils.js" defer></script>
    <style>
        main{max-width:1400px;margin:0 auto;padding:40px 28px}
        .page-header{display:flex;align-items:center;gap:16px;margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--border);}
        .page-icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;color:var(--primary);background:rgba(99,102,241,0.1);}
        .page-header h1{font-size:1.5rem;font-weight:800;letter-spacing:-0.5px;color:var(--text);}
        .page-header p{font-size:0.85rem;color:var(--dim);margin-top:2px;}
        .toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;margin-bottom:16px}
        .tabs{display:flex;gap:3px;background:var(--surface);padding:4px;border-radius:10px}
        .tab{padding:8px 20px;border-radius:8px;font-weight:700;font-size:0.82rem;cursor:pointer;transition:0.2s;color:var(--dim);border:none;background:none;font-family:'Plus Jakarta Sans',sans-serif}
        .tab.active{background:var(--primary);color:white}
        .filters{display:flex;gap:6px;flex-wrap:wrap}
        .fb{padding:6px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--dim);font-weight:700;font-size:0.75rem;cursor:pointer;transition:0.2s;font-family:'Plus Jakarta Sans',sans-serif}
        .fb.active{background:var(--primary);color:white;border-color:var(--primary)}
        .fb:hover:not(.active){background:var(--surface);color:var(--text);}
        .search-bar{background:var(--surface);border:1px solid var(--border);border-radius:12px;display:flex;align-items:center;gap:12px;padding:10px 16px;margin-bottom:16px;}
        .search-bar svg{color:var(--dim);flex-shrink:0;}
        .search-bar input{background:none;border:none;color:var(--text);font-size:0.9rem;outline:none;flex:1;font-family:'Plus Jakarta Sans',sans-serif;padding:0;}
        .search-bar input::placeholder{color:var(--dim);}
        .search-count{font-size:0.75rem;color:var(--dim);white-space:nowrap;font-weight:700;}
        .table-wrap{border-radius:14px;overflow:hidden;}
        .table-header{padding:14px 22px;display:flex;justify-content:space-between;align-items:center;}
        .table-header span{font-size:0.68rem;letter-spacing:2px;font-weight:700;color:var(--dim);}
        .table-count{background:rgba(99,102,241,0.08);color:var(--primary);border-radius:20px;padding:3px 10px;font-size:0.72rem;font-weight:800;}
        th{padding:12px 18px;font-size:0.66rem;letter-spacing:1.5px;color:var(--muted);font-weight:700;text-transform:uppercase;}
        td{padding:12px 18px;font-size:0.86rem;border-bottom:1px solid var(--border);}
        .code{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:2px 7px;font-weight:800;font-size:0.78rem;font-family:monospace;color:var(--text);}
        .sub-text{font-size:0.75rem;color:var(--dim);margin-top:2px;}
        .em{text-align:center;padding:40px;color:var(--dim);font-size:0.88rem;}
        .highlight{background:rgba(99,102,241,0.15);border-radius:3px;padding:0 2px;}
        .btn-del-row{background:none;border:none;color:var(--danger);cursor:pointer;padding:4px 6px;border-radius:6px;font-size:0.72rem;font-weight:700;transition:0.15s;font-family:'Plus Jakarta Sans',sans-serif;}
        .btn-del-row:hover{background:rgba(239,68,68,0.1);}
        th.ac{width:52px;}
    </style>
</head>
<body>
<nav class="nav">
    <div class="brand"><div class="brand-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></div>SmartLoan IT</div>
    <div class="nav-right">
        <button class="btn-icon" onclick="toggleTheme()" title="Cambiar tema" aria-label="Cambiar tema">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button class="btn-icon" onclick="document.body.classList.toggle('fullscreen-mode')" title="Pantalla completa" aria-label="Pantalla completa">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        </button>
        <a href="/home/dashboard.html" class="nav-link"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>Dashboard</a>
    </div>
</nav>
<main>
    <div class="page-header">
        <div class="page-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></div>
        <div><h1>Historial y Trazabilidad</h1><p>Registro completo de todos los movimientos del sistema</p></div>
    </div>
    <div class="toolbar">
        <div class="tabs">
            <button class="tab active" onclick="setTab('p',this)">Préstamos</button>
            <button class="tab" onclick="setTab('d',this)">Devoluciones</button>
        </div>
        <div class="filters" id="filtros">
            <button class="fb active" onclick="setF('todos',this)">Todos</button>
            <button class="fb" onclick="setF('activos',this)">Activos</button>
            <button class="fb" onclick="setF('vencidos',this)">Vencidos</button>
            <button class="fb" onclick="setF('devueltos',this)">Devueltos</button>
        </div>
    </div>
    <div class="search-bar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="busq" placeholder="Buscar por alumno, equipo, código, motivo..." oninput="buscar()">
        <span class="search-count" id="search-count"></span>
    </div>
    <div id="tp" class="table-wrap"><div class="skeleton-card"><div class="skeleton skeleton-line w80"></div><div class="skeleton skeleton-line w60"></div><div class="skeleton skeleton-line w40"></div><div class="skeleton skeleton-line w70"></div><div class="skeleton skeleton-line w50"></div></div></div>
    <div id="td" class="table-wrap" style="display:none"><div class="skeleton-card"><div class="skeleton skeleton-line w80"></div><div class="skeleton skeleton-line w60"></div><div class="skeleton skeleton-line w40"></div><div class="skeleton skeleton-line w70"></div><div class="skeleton skeleton-line w50"></div></div></div>
</main>
<div class="toast" id="toast"></div>
<script src="/js/api.js"></script>
<script>
if(!localStorage.getItem('encargado')) window.location.href='/';
let prestamos=[],devs=[];
let tabAct='p',filtAct='todos';

function resaltar(texto,q){
    if(!q||!texto) return texto||'—';
    var re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    return String(texto).replace(re,'<span class="highlight">$1</span>');
}

async function cargar(){
    try{
        let pr=await apiFetch('/prestamos');
        let dr=await apiFetch('/devoluciones');
        prestamos=await pr.json();
        devs=await dr.json();
        renderP();renderD();
    }catch(e){
        console.error(e);
        showError(document.getElementById('tp'),{message:'No se pudieron cargar los datos. Verifica la conexi\u00f3n con el servidor.',retry:'cargar()'});
        showError(document.getElementById('td'),{message:'',retry:null});
    }
}

function getPrestFiltrados(){
    var ahora=new Date();
    var d=prestamos.slice();
    if(filtAct==='activos')   d=d.filter(function(p){return p.estado==='ACTIVO'&&new Date(p.fecha_devolucion_estimada)>=ahora;});
    if(filtAct==='vencidos')  d=d.filter(function(p){return p.estado==='ACTIVO'&&new Date(p.fecha_devolucion_estimada)<ahora;});
    if(filtAct==='devueltos') d=d.filter(function(p){return p.estado==='DEVUELTO';});
    var q=document.getElementById('busq').value.trim().toLowerCase();
    if(q){
        d=d.filter(function(p){
            return (p.alumno_nombre&&p.alumno_nombre.toLowerCase().includes(q))||
                   (p.alumno_apellido&&p.alumno_apellido.toLowerCase().includes(q))||
                   (p.codigo_alumno&&p.codigo_alumno.toLowerCase().includes(q))||
                   (p.equipo&&p.equipo.toLowerCase().includes(q))||
                   (p.marca&&p.marca.toLowerCase().includes(q))||
                   (p.motivo&&p.motivo.toLowerCase().includes(q))||
                   (String(p.id_prestamo)===q)||
                   (p.alumno_nombre&&p.alumno_apellido&&
                    (p.alumno_nombre+' '+p.alumno_apellido).toLowerCase().includes(q))||
                   (p.alumno_apellido&&p.alumno_nombre&&
                    (p.alumno_apellido+' '+p.alumno_nombre).toLowerCase().includes(q))||
                   (p.encargado_nombre&&p.encargado_nombre.toLowerCase().includes(q))||
                   (p.encargado_apellido&&p.encargado_apellido.toLowerCase().includes(q))||
                   (p.encargado_nombre&&p.encargado_apellido&&
                    (p.encargado_nombre+' '+p.encargado_apellido).toLowerCase().includes(q))||
                   (p.encargado_apellido&&p.encargado_nombre&&
                    (p.encargado_apellido+' '+p.encargado_nombre).toLowerCase().includes(q));
        });
    }
    return d;
}

function getDevFiltrados(){
    var q=document.getElementById('busq').value.trim().toLowerCase();
    if(!q) return devs.slice();
    return devs.filter(function(d){
        return (d.alumno_nombre&&d.alumno_nombre.toLowerCase().includes(q))||
               (d.alumno_apellido&&d.alumno_apellido.toLowerCase().includes(q))||
               (d.codigo_alumno&&d.codigo_alumno.toLowerCase().includes(q))||
               (d.equipo&&d.equipo.toLowerCase().includes(q))||
               (d.tipo_dano&&d.tipo_dano.toLowerCase().includes(q))||
               (String(d.id_prestamo)===q)||
               (String(d.id_devolucion)===q)||
               (d.alumno_nombre&&d.alumno_apellido&&
                (d.alumno_nombre+' '+d.alumno_apellido).toLowerCase().includes(q))||
               (d.alumno_apellido&&d.alumno_nombre&&
                (d.alumno_apellido+' '+d.alumno_nombre).toLowerCase().includes(q))||
               (d.enc_prestamo_nombre&&d.enc_prestamo_nombre.toLowerCase().includes(q))||
               (d.enc_prestamo_apellido&&d.enc_prestamo_apellido.toLowerCase().includes(q))||
               (d.enc_prestamo_nombre&&d.enc_prestamo_apellido&&
                (d.enc_prestamo_nombre+' '+d.enc_prestamo_apellido).toLowerCase().includes(q))||
               (d.enc_prestamo_apellido&&d.enc_prestamo_nombre&&
                (d.enc_prestamo_apellido+' '+d.enc_prestamo_nombre).toLowerCase().includes(q))||
               (d.enc_devolucion_nombre&&d.enc_devolucion_nombre.toLowerCase().includes(q))||
               (d.enc_devolucion_apellido&&d.enc_devolucion_apellido.toLowerCase().includes(q))||
               (d.enc_devolucion_nombre&&d.enc_devolucion_apellido&&
                (d.enc_devolucion_nombre+' '+d.enc_devolucion_apellido).toLowerCase().includes(q))||
               (d.enc_devolucion_apellido&&d.enc_devolucion_nombre&&
                (d.enc_devolucion_apellido+' '+d.enc_devolucion_nombre).toLowerCase().includes(q));
    });
}

function renderP(){
    var ahora=new Date();
    var d=getPrestFiltrados();
    var q=document.getElementById('busq').value.trim();
    var w=document.getElementById('tp');
    var header='<div class="table-header"><span>Registro de préstamos</span><span class="table-count">'+d.length+' registros</span></div>';
    if(tabAct==='p') document.getElementById('search-count').textContent=d.length+' resultado'+(d.length!==1?'s':'');
    if(!d.length){w.innerHTML=header+'<div class="em">Sin registros con este criterio</div>';return;}
    var html=header+'<table><thead><tr><th>#</th><th>Alumno</th><th>Equipo</th><th>Fecha préstamo</th><th>Vencimiento</th><th>Encargado</th><th>Motivo</th><th>Estado</th><th class="ac"></th></tr></thead><tbody>';
    d.forEach(function(p){
        var venc=p.estado==='ACTIVO'&&new Date(p.fecha_devolucion_estimada)<ahora;
        var badge=venc?'<span class="badge badge-danger">Vencido</span>':p.estado==='DEVUELTO'?'<span class="badge badge-success">Devuelto</span>':'<span class="badge badge-primary">Activo</span>';
        html+='<tr>';
        html+='<td><span class="code">#'+p.id_prestamo+'</span></td>';
        html+='<td><strong>'+resaltar(p.codigo_alumno,q)+'</strong><div class="sub-text">'+resaltar(p.alumno_nombre+' '+p.alumno_apellido,q)+'</div><div class="sub-text">'+(p.carrera||'—')+'</div></td>';
        html+='<td><strong>'+resaltar(p.equipo,q)+'</strong><div class="sub-text">'+p.tipo+' &middot; '+p.marca+'</div></td>';
        html+='<td>'+ff(p.fecha_prestamo)+'</td>';
        html+='<td style="'+(venc?'color:var(--danger);font-weight:700':'')+'">'+ff(p.fecha_devolucion_estimada)+'</td>';
        html+='<td style="color:var(--dim);font-size:0.82rem">'+resaltar((p.encargado_nombre||'')+' '+(p.encargado_apellido||''),q)+'</td>';
        html+='<td style="color:var(--dim);font-size:0.82rem">'+resaltar(p.motivo||'—',q)+'</td>';
        html+='<td>'+badge+'</td>';
        html+='<td><button class="btn-del-row" onclick="eliminarPrestamo('+p.id_prestamo+')" title="Eliminar préstamo">✕</button></td>';
        html+='</tr>';
    });
    html+='</tbody></table>';
    w.innerHTML=html;
}

function renderD(){
    var d=getDevFiltrados();
    var q=document.getElementById('busq').value.trim();
    var w=document.getElementById('td');
    var header='<div class="table-header"><span>Registro de devoluciones</span><span class="table-count">'+d.length+' registros</span></div>';
    if(tabAct==='d') document.getElementById('search-count').textContent=d.length+' resultado'+(d.length!==1?'s':'');
    if(!d.length){w.innerHTML=header+'<div class="em">Sin registros con este criterio</div>';return;}
    var html=header+'<table><thead><tr><th>#Dev</th><th>#Pres</th><th>Alumno</th><th>Equipo</th><th>Fecha dev.</th><th>Registró</th><th>Recibió</th><th>Estado</th><th>Daño</th><th>Multa</th><th>Total</th><th class="ac"></th></tr></thead><tbody>';
    d.forEach(function(dv){
        var danoCell=dv.tiene_dano?'<span style="color:var(--danger);font-weight:700">'+(dv.tipo_dano||'Si')+'</span>':'<span style="color:var(--success)">Sin daños</span>';
        var multaStyle=dv.monto_multa>0?'color:var(--warn);font-weight:700':'color:var(--dim)';
        html+='<tr>';
        html+='<td><span class="code">#'+dv.id_devolucion+'</span></td>';
        html+='<td><span class="code">#'+dv.id_prestamo+'</span></td>';
        html+='<td><strong>'+resaltar(dv.codigo_alumno,q)+'</strong><div class="sub-text">'+resaltar(dv.alumno_nombre+' '+dv.alumno_apellido,q)+'</div></td>';
        html+='<td><strong>'+resaltar(dv.equipo,q)+'</strong><div class="sub-text">'+dv.tipo+'</div></td>';
        html+='<td>'+ff(dv.fecha_devolucion)+'</td>';
        html+='<td style="color:var(--dim);font-size:0.82rem">'+resaltar((dv.enc_prestamo_nombre||'')+' '+(dv.enc_prestamo_apellido||''),q)+'</td>';
        html+='<td style="color:var(--dim);font-size:0.82rem">'+resaltar((dv.enc_devolucion_nombre||'')+' '+(dv.enc_devolucion_apellido||''),q)+'</td>';
        html+='<td>'+dv.estado_equipo+'</td>';
        html+='<td>'+danoCell+'</td>';
        html+='<td style="'+multaStyle+'">'+(dv.dias_retraso>0?dv.dias_retraso+'d &middot; Gs.'+fn(dv.monto_multa):'—')+'</td>';
        html+='<td style="font-weight:800;color:'+(dv.total_cobro>0?'var(--warn)':'var(--dim)')+'">Gs. '+fn(dv.total_cobro||0)+'</td>';
        html+='<td><button class="btn-del-row" onclick="eliminarDevolucion('+dv.id_devolucion+')" title="Eliminar devolución">✕</button></td>';
        html+='</tr>';
    });
    html+='</tbody></table>';
    w.innerHTML=html;
}

function buscar(){
    if(tabAct==='p') renderP();
    else renderD();
}

function setTab(t,el){
    tabAct=t;
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});
    el.classList.add('active');
    document.getElementById('tp').style.display=t==='p'?'block':'none';
    document.getElementById('td').style.display=t==='d'?'block':'none';
    document.getElementById('filtros').style.display=t==='p'?'flex':'none';
    document.getElementById('busq').value='';
    document.getElementById('search-count').textContent='';
    if(t==='p') renderP(); else renderD();
}

function setF(f,el){
    filtAct=f;
    document.querySelectorAll('.fb').forEach(function(b){b.classList.remove('active');});
    el.classList.add('active');
    renderP();
}

function eliminarPrestamo(id){
    if(!confirm('Eliminar el préstamo #'+id+'?\n\nSe borrarán todos los datos asociados (incluyendo devolución si existe).\nEsta acción no se puede deshacer.')) return;
    apiFetch('/prestamos/'+id,{method:'DELETE'}).then(function(r){
        if(r.ok){st('Préstamo eliminado');cargar();}
        else{r.json().then(function(d){st(d.mensaje||'Error','t-err');});}
    }).catch(function(){st('Error de conexión','t-err');});
}
function eliminarDevolucion(id){
    if(!confirm('Eliminar la devolución #'+id+'?\n\nEl préstamo se reactivará y el equipo volverá a estar disponible.\nEsta acción no se puede deshacer.')) return;
    apiFetch('/devoluciones/'+id,{method:'DELETE'}).then(function(r){
        if(r.ok){st('Devolución eliminada');cargar();}
        else{r.json().then(function(d){st(d.mensaje||'Error','t-err');});}
    }).catch(function(){st('Error de conexión','t-err');});
}
window.onload=function(){ cargar(); initTheme(); initSpotlight([]); };
</script>
</body>
</html>
