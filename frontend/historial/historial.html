<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartLoan IT | Historial</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{--primary:#6366f1;--accent:#00f2ff;--warn:#f59e0b;--success:#22c55e;--danger:#ef4444;--bg:#030712;--card:rgba(30,41,59,0.4);--text:#f8fafc;--dim:#94a3b8;--border:rgba(255,255,255,0.08);}
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif;}
        body{background:var(--bg);color:var(--text);min-height:100vh;}
        .glow{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 60% 10%,rgba(99,102,241,0.1) 0%,transparent 50%);z-index:-1;}
        nav{padding:18px 5%;display:flex;justify-content:space-between;align-items:center;background:rgba(3,7,18,0.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
        .brand{font-size:1.3rem;font-weight:800;display:flex;align-items:center;gap:10px;}
        .bi{background:linear-gradient(135deg,var(--primary),var(--accent));width:32px;height:32px;border-radius:9px;display:grid;place-items:center;}
        .back{display:flex;align-items:center;gap:8px;color:var(--dim);text-decoration:none;font-weight:700;font-size:0.9rem;padding:10px 18px;border-radius:12px;border:1px solid var(--border);transition:0.3s;}
        .back:hover{background:rgba(255,255,255,0.05);color:white;}
        main{max-width:1400px;margin:0 auto;padding:40px 24px;}
        .ph{margin-bottom:28px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;}
        .ph h1{font-size:2.6rem;font-weight:800;letter-spacing:-1.5px;background:linear-gradient(to right,#fff,var(--dim));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
        .ph p{color:var(--dim);margin-top:4px;}
        .fs{display:flex;gap:10px;flex-wrap:wrap;}
        .fb{padding:8px 16px;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:11px;color:var(--dim);font-weight:700;font-size:0.8rem;cursor:pointer;transition:0.3s;font-family:'Plus Jakarta Sans',sans-serif;}
        .fb.active{background:var(--primary);color:white;border-color:var(--primary);}
        .fb:hover:not(.active){background:rgba(255,255,255,0.08);color:white;}
        .tabs{display:flex;gap:4px;background:rgba(0,0,0,0.3);padding:5px;border-radius:13px;width:fit-content;margin-bottom:22px;}
        .tab{padding:10px 24px;border-radius:10px;font-weight:700;font-size:0.87rem;cursor:pointer;transition:0.3s;color:var(--dim);border:none;background:none;font-family:'Plus Jakarta Sans',sans-serif;}
        .tab.active{background:var(--primary);color:white;}
        .tw{background:var(--card);border-radius:22px;border:1px solid var(--border);overflow-x:auto;}
        table{width:100%;border-collapse:collapse;min-width:750px;}
        th{padding:15px 18px;background:rgba(255,255,255,0.02);color:var(--dim);text-transform:uppercase;font-size:0.7rem;letter-spacing:2px;text-align:left;white-space:nowrap;}
        td{padding:13px 18px;border-bottom:1px solid var(--border);font-size:0.87rem;}
        tr:last-child td{border-bottom:none;}
        tr:hover td{background:rgba(255,255,255,0.02);}
        .badge{padding:4px 10px;border-radius:7px;font-size:0.7rem;font-weight:800;text-transform:uppercase;display:inline-block;}
        .ba{background:rgba(99,102,241,0.15);color:var(--primary);border:1px solid rgba(99,102,241,0.25);}
        .bd{background:rgba(34,197,94,0.1);color:var(--success);border:1px solid rgba(34,197,94,0.2);}
        .bv{background:rgba(239,68,68,0.1);color:var(--danger);border:1px solid rgba(239,68,68,0.2);}
        .code{background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:7px;padding:3px 8px;font-weight:800;font-size:0.82rem;font-family:monospace;}
        .em{text-align:center;padding:50px;color:var(--dim);}
        @media(max-width:900px){main{padding:20px 16px}}
    </style>
</head>
<body>
<div class="glow"></div>
<nav>
    <div class="brand">
        <div class="bi"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></div>
        SmartLoan IT
    </div>
    <a href="/home/dashboard.html" class="back">← Dashboard</a>
</nav>
<main>
    <div class="ph">
        <div><h1>Historial y Trazabilidad</h1><p>Registro completo de todos los movimientos del sistema</p></div>
        <div class="fs" id="filtros">
            <button class="fb active" onclick="setF('todos',this)">Todos</button>
            <button class="fb" onclick="setF('activos',this)">🔴 Activos</button>
            <button class="fb" onclick="setF('vencidos',this)">⚠️ Vencidos</button>
            <button class="fb" onclick="setF('devueltos',this)">✅ Devueltos</button>
        </div>
    </div>
    <div class="tabs">
        <button class="tab active" onclick="setTab('p',this)">📋 Préstamos</button>
        <button class="tab" onclick="setTab('d',this)">📥 Devoluciones</button>
    </div>
    <div id="tp" class="tw"><div class="em">Cargando...</div></div>
    <div id="td" class="tw" style="display:none"><div class="em">Cargando...</div></div>
</main>
<script>
var API = 'http://localhost:3000';
var prestamos = [], devs = [];
var tabAct = 'p', filtAct = 'todos';

function ff(d) {
    if (!d) return '—';
    return new Date(d).toLocaleString('es-PY', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function fn(n) { return Number(n).toLocaleString('es-PY'); }

async function cargar() {
    try {
        var pr = await fetch(API + '/prestamos');
        var dr = await fetch(API + '/devoluciones');
        if (!pr.ok || !dr.ok) throw new Error('Error servidor');
        prestamos = await pr.json();
        devs = await dr.json();
        renderP();
        renderD();
    } catch(e) {
        console.error('Error historial:', e);
        document.getElementById('tp').innerHTML = '<div class="em">Error al cargar datos. Verificá que el servidor esté corriendo.</div>';
    }
}

function renderP() {
    var ahora = new Date();
    var d = prestamos.slice();
    if (filtAct === 'activos')   d = d.filter(function(p){ return p.estado === 'ACTIVO' && new Date(p.fecha_devolucion_estimada) >= ahora; });
    if (filtAct === 'vencidos')  d = d.filter(function(p){ return p.estado === 'ACTIVO' && new Date(p.fecha_devolucion_estimada) < ahora; });
    if (filtAct === 'devueltos') d = d.filter(function(p){ return p.estado === 'DEVUELTO'; });

    var w = document.getElementById('tp');
    if (!d.length) { w.innerHTML = '<div class="em">Sin registros con este filtro</div>'; return; }

    var html = '<table><thead><tr>';
    html += '<th>#</th><th>Alumno</th><th>Equipo</th><th>Fecha Préstamo</th><th>Vencimiento</th><th>Motivo</th><th>Estado</th>';
    html += '</tr></thead><tbody>';

    d.forEach(function(p) {
        var venc = p.estado === 'ACTIVO' && new Date(p.fecha_devolucion_estimada) < ahora;
        var estadoBadge = venc
            ? '<span class="badge bv">Vencido</span>'
            : p.estado === 'DEVUELTO'
                ? '<span class="badge bd">Devuelto</span>'
                : '<span class="badge ba">Activo</span>';
        var vencStyle = venc ? 'color:var(--danger);font-weight:700' : '';

        html += '<tr>';
        html += '<td><span class="code">#' + p.id_prestamo + '</span></td>';
        html += '<td><strong>' + p.codigo_alumno + '</strong><br>';
        html += '<span style="font-size:0.8rem;color:var(--dim)">' + p.alumno_nombre + ' ' + p.alumno_apellido + '</span><br>';
        html += '<span style="font-size:0.75rem;color:var(--dim)">' + (p.carrera || '—') + '</span></td>';
        html += '<td><strong>' + p.equipo + '</strong><br><span style="font-size:0.8rem;color:var(--dim)">' + p.tipo + ' · ' + p.marca + '</span></td>';
        html += '<td>' + ff(p.fecha_prestamo) + '</td>';
        html += '<td style="' + vencStyle + '">' + ff(p.fecha_devolucion_estimada) + '</td>';
        html += '<td style="color:var(--dim);font-size:0.83rem">' + (p.motivo || '—') + '</td>';
        html += '<td>' + estadoBadge + '</td>';
        html += '</tr>';
    });

    html += '</tbody></table>';
    w.innerHTML = html;
}

function renderD() {
    var w = document.getElementById('td');
    if (!devs.length) { w.innerHTML = '<div class="em">Sin devoluciones registradas</div>'; return; }

    var html = '<table><thead><tr>';
    html += '<th>#Dev</th><th>#Prés</th><th>Alumno</th><th>Equipo</th>';
    html += '<th>Fecha Dev.</th><th>Estado</th><th>Daño</th><th>Multa</th><th>Total</th>';
    html += '</tr></thead><tbody>';

    devs.forEach(function(d) {
        var danoCell = d.tiene_dano
            ? '<span style="color:var(--danger);font-weight:700">⚠️ ' + (d.tipo_dano || 'Sí') + '</span>'
            : '<span style="color:var(--success)">✅ Sin daños</span>';
        var multaCell = d.dias_retraso > 0
            ? d.dias_retraso + 'd · Gs.' + fn(d.monto_multa)
            : '—';
        var multaStyle = d.monto_multa > 0 ? 'color:var(--warn);font-weight:700' : 'color:var(--dim)';
        var totalStyle = d.total_cobro > 0 ? 'var(--warn)' : 'var(--dim)';

        html += '<tr>';
        html += '<td><span class="code">#' + d.id_devolucion + '</span></td>';
        html += '<td><span class="code">#' + d.id_prestamo + '</span></td>';
        html += '<td><strong>' + d.codigo_alumno + '</strong><br>';
        html += '<span style="font-size:0.8rem;color:var(--dim)">' + d.alumno_nombre + ' ' + d.alumno_apellido + '</span></td>';
        html += '<td><strong>' + d.equipo + '</strong><br><span style="font-size:0.8rem;color:var(--dim)">' + d.tipo + '</span></td>';
        html += '<td>' + ff(d.fecha_devolucion) + '</td>';
        html += '<td>' + d.estado_equipo + '</td>';
        html += '<td>' + danoCell + '</td>';
        html += '<td style="' + multaStyle + '">' + multaCell + '</td>';
        html += '<td style="font-weight:800;color:' + totalStyle + '">Gs. ' + fn(d.total_cobro || 0) + '</td>';
        html += '</tr>';
    });

    html += '</tbody></table>';
    w.innerHTML = html;
}

function setTab(t, el) {
    tabAct = t;
    document.querySelectorAll('.tab').forEach(function(x){ x.classList.remove('active'); });
    el.classList.add('active');
    document.getElementById('tp').style.display = t === 'p' ? 'block' : 'none';
    document.getElementById('td').style.display  = t === 'd' ? 'block' : 'none';
    document.getElementById('filtros').style.display = t === 'p' ? 'flex' : 'none';
}

function setF(f, el) {
    filtAct = f;
    document.querySelectorAll('.fb').forEach(function(b){ b.classList.remove('active'); });
    el.classList.add('active');
    renderP();
}

window.onload = cargar;
</script>
</body>
</html>
