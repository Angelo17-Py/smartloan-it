<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartLoan IT | Historial</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary:#6366f1; --accent:#00f2ff; --warn:#f59e0b; --success:#22c55e; --danger:#ef4444; --bg:#030712; --card-bg:rgba(30,41,59,0.4); --text:#f8fafc; --text-dim:#94a3b8; --border:rgba(255,255,255,0.08); --transition:all 0.4s cubic-bezier(0.23,1,0.32,1); }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans',sans-serif; }
        body { background:var(--bg); color:var(--text); min-height:100vh; }
        .bg-glow { position:fixed; top:0; left:0; width:100%; height:100%; background:radial-gradient(circle at 60% 10%, rgba(99,102,241,0.1) 0%, transparent 50%); z-index:-1; }
        .top-nav { padding:18px 5%; display:flex; justify-content:space-between; align-items:center; background:rgba(3,7,18,0.9); backdrop-filter:blur(10px); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:100; }
        .brand { font-size:1.3rem; font-weight:800; display:flex; align-items:center; gap:10px; }
        .brand-icon { background:linear-gradient(135deg,var(--primary),var(--accent)); width:32px; height:32px; border-radius:9px; display:grid; place-items:center; }
        .btn-back { display:flex; align-items:center; gap:8px; color:var(--text-dim); text-decoration:none; font-weight:700; font-size:0.9rem; padding:10px 18px; border-radius:12px; border:1px solid var(--border); transition:var(--transition); }
        .btn-back:hover { background:rgba(255,255,255,0.05); color:white; }
        .content { max-width:1400px; margin:0 auto; padding:40px 24px; }
        .page-header { margin-bottom:30px; display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:16px; }
        .page-header h1 { font-size:2.6rem; font-weight:800; letter-spacing:-1.5px; background:linear-gradient(to right,#fff,var(--text-dim)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .page-header p { color:var(--text-dim); margin-top:4px; }
        .filters { display:flex; gap:12px; flex-wrap:wrap; }
        .filter-btn { padding:9px 18px; background:rgba(255,255,255,0.04); border:1px solid var(--border); border-radius:12px; color:var(--text-dim); font-weight:700; font-size:0.82rem; cursor:pointer; transition:var(--transition); font-family:'Plus Jakarta Sans',sans-serif; }
        .filter-btn.active { background:var(--primary); color:white; border-color:var(--primary); }
        .filter-btn:hover:not(.active) { background:rgba(255,255,255,0.08); color:white; }
        .tabs { display:flex; gap:4px; background:rgba(0,0,0,0.3); padding:5px; border-radius:14px; width:fit-content; margin-bottom:24px; }
        .tab { padding:11px 26px; border-radius:10px; font-weight:700; font-size:0.88rem; cursor:pointer; transition:var(--transition); color:var(--text-dim); border:none; background:none; font-family:'Plus Jakarta Sans',sans-serif; }
        .tab.active { background:var(--primary); color:white; }
        .table-wrap { background:var(--card-bg); border-radius:22px; border:1px solid var(--border); overflow-x:auto; }
        table { width:100%; border-collapse:collapse; min-width:800px; }
        th { padding:16px 18px; background:rgba(255,255,255,0.02); color:var(--text-dim); text-transform:uppercase; font-size:0.7rem; letter-spacing:2px; text-align:left; white-space:nowrap; }
        td { padding:14px 18px; border-bottom:1px solid var(--border); font-size:0.88rem; }
        tr:last-child td { border-bottom:none; }
        tr:hover td { background:rgba(255,255,255,0.02); }
        .badge { padding:4px 10px; border-radius:7px; font-size:0.7rem; font-weight:800; text-transform:uppercase; display:inline-block; }
        .badge-activo  { background:rgba(99,102,241,0.15); color:var(--primary); border:1px solid rgba(99,102,241,0.25); }
        .badge-devuelto{ background:rgba(34,197,94,0.1); color:var(--success); border:1px solid rgba(34,197,94,0.2); }
        .badge-vencido { background:rgba(239,68,68,0.1); color:var(--danger); border:1px solid rgba(239,68,68,0.2); }
        .code-chip { background:rgba(255,255,255,0.06); border:1px solid var(--border); border-radius:7px; padding:3px 8px; font-weight:800; font-size:0.82rem; font-family:monospace; }
        .empty { text-align:center; padding:60px; color:var(--text-dim); }
    </style>
</head>
<body>
<div class="bg-glow"></div>
<nav class="top-nav">
    <div class="brand">
        <div class="brand-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></div>
        SmartLoan IT
    </div>
    <a href="/home/dashboard.html" class="btn-back">← Volver al Dashboard</a>
</nav>

<main class="content">
    <div class="page-header">
        <div>
            <h1>Historial y Trazabilidad</h1>
            <p>Registro completo de todos los movimientos del sistema</p>
        </div>
        <div class="filters" id="filtros">
            <button class="filter-btn active" onclick="setFiltro('todos',this)">Todos</button>
            <button class="filter-btn" onclick="setFiltro('activos',this)">🔴 Activos</button>
            <button class="filter-btn" onclick="setFiltro('vencidos',this)">⚠️ Vencidos</button>
            <button class="filter-btn" onclick="setFiltro('devueltos',this)">✅ Devueltos</button>
        </div>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="setTab('prestamos',this)">📋 Préstamos</button>
        <button class="tab" onclick="setTab('devoluciones',this)">📥 Devoluciones</button>
    </div>

    <div id="tablaPrestamos" class="table-wrap">
        <div class="empty">Cargando...</div>
    </div>
    <div id="tablaDevs" class="table-wrap" style="display:none">
        <div class="empty">Cargando...</div>
    </div>
</main>

<script>
let prestamos=[], devoluciones=[];
let tabActual='prestamos', filtroActual='todos';

async function cargarTodo() {
    try {
        const [pRes, dRes] = await Promise.all([fetch('/prestamos'), fetch('/devoluciones')]);
        prestamos    = await pRes.json();
        devoluciones = await dRes.json();
        renderPrestamos();
        renderDevoluciones();
    } catch(err) {
        document.getElementById('tablaPrestamos').innerHTML='<div class="empty">Error al cargar datos. Verificá que el servidor esté corriendo.</div>';
    }
}

function renderPrestamos() {
    const ahora = new Date();
    let data = [...prestamos];
    if(filtroActual==='activos')   data=data.filter(p=>p.estado==='ACTIVO'&&new Date(p.fecha_devolucion_estimada)>=ahora);
    if(filtroActual==='vencidos')  data=data.filter(p=>p.estado==='ACTIVO'&&new Date(p.fecha_devolucion_estimada)<ahora);
    if(filtroActual==='devueltos') data=data.filter(p=>p.estado==='DEVUELTO');
    const wrap=document.getElementById('tablaPrestamos');
    if(!data.length){wrap.innerHTML='<div class="empty">Sin registros con este filtro</div>';return;}
    const vencido=(p)=>p.estado==='ACTIVO'&&new Date(p.fecha_devolucion_estimada)<ahora;
    wrap.innerHTML=`
        <table>
            <thead><tr>
                <th>#</th><th>Alumno</th><th>Equipo</th>
                <th>Fecha Préstamo</th><th>Vencimiento</th>
                <th>Motivo</th><th>Accesorios</th><th>Estado</th>
            </tr></thead>
            <tbody>
                ${data.map(p=>`
                    <tr>
                        <td><span class="code-chip">#${p.id_prestamo}</span></td>
                        <td>
                            <strong>${p.codigo_alumno}</strong><br>
                            <span style="font-size:0.8rem;color:var(--text-dim)">${p.alumno_nombre} ${p.alumno_apellido}</span><br>
                            <span style="font-size:0.75rem;color:var(--text-dim)">${p.carrera||'—'} · ${p.curso||'—'}</span>
                        </td>
                        <td><strong>${p.equipo}</strong><br><span style="font-size:0.8rem;color:var(--text-dim)">${p.tipo} · ${p.marca}</span></td>
                        <td>${fmtFecha(p.fecha_prestamo)}</td>
                        <td style="${vencido(p)?'color:var(--danger);font-weight:700':''}">${fmtFecha(p.fecha_devolucion_estimada)}</td>
                        <td style="color:var(--text-dim);font-size:0.85rem">${p.motivo||'—'}</td>
                        <td style="color:var(--text-dim);font-size:0.85rem">${p.accesorios||'—'}</td>
                        <td>${vencido(p)
                            ?'<span class="badge badge-vencido">Vencido</span>'
                            :p.estado==='DEVUELTO'
                                ?'<span class="badge badge-devuelto">Devuelto</span>'
                                :'<span class="badge badge-activo">Activo</span>'
                        }</td>
                    </tr>
                `).join('')}
            </tbody>
        </table>`;
}

function renderDevoluciones() {
    const wrap=document.getElementById('tablaDevs');
    if(!devoluciones.length){wrap.innerHTML='<div class="empty">Sin devoluciones registradas</div>';return;}
    wrap.innerHTML=`
        <table>
            <thead><tr>
                <th>#Dev</th><th>#Prés</th><th>Alumno</th><th>Equipo</th>
                <th>Fecha Dev.</th><th>Estado</th><th>Daño</th>
                <th>Multa</th><th>Costo Daño</th><th>Total</th>
            </tr></thead>
            <tbody>
                ${devoluciones.map(d=>`
                    <tr>
                        <td><span class="code-chip">#${d.id_devolucion}</span></td>
                        <td><span class="code-chip">#${d.id_prestamo}</span></td>
                        <td>
                            <strong>${d.codigo_alumno}</strong><br>
                            <span style="font-size:0.8rem;color:var(--text-dim)">${d.alumno_nombre} ${d.alumno_apellido}</span>
                        </td>
                        <td><strong>${d.equipo}</strong><br><span style="font-size:0.8rem;color:var(--text-dim)">${d.tipo}</span></td>
                        <td>${fmtFecha(d.fecha_devolucion)}</td>
                        <td>${d.estado_equipo}</td>
                        <td>${d.tiene_dano?`<span style="color:var(--danger);font-weight:700">⚠️ ${d.tipo_dano||'Sí'}</span>`:'<span style="color:var(--success)">✅ Sin daños</span>'}</td>
                        <td style="${d.monto_multa>0?'color:var(--warn);font-weight:700':'color:var(--text-dim)'">${d.dias_retraso>0?`${d.dias_retraso}d · Gs.${fmtNum(d.monto_multa)}`:'—'}</td>
                        <td style="${d.monto_dano>0?'color:var(--danger);font-weight:700':'color:var(--text-dim)'">${d.monto_dano>0?`Gs. ${fmtNum(d.monto_dano)}`:'—'}</td>
                        <td style="font-weight:800;color:${d.total_cobro>0?'var(--warn)':'var(--text-dim)'}">Gs. ${fmtNum(d.total_cobro||0)}</td>
                    </tr>
                `).join('')}
            </tbody>
        </table>`;
}

function setTab(tab,el) {
    tabActual=tab;
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('tablaPrestamos').style.display=tab==='prestamos'?'block':'none';
    document.getElementById('tablaDevs').style.display=tab==='devoluciones'?'block':'none';
    // Filtros solo aplican a préstamos
    document.getElementById('filtros').style.display=tab==='prestamos'?'flex':'none';
}

function setFiltro(f,el) {
    filtroActual=f;
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    el.classList.add('active');
    renderPrestamos();
}

function fmtFecha(d){if(!d)return'—';return new Date(d).toLocaleString('es-PY',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function fmtNum(n){return Number(n).toLocaleString('es-PY');}

window.onload=cargarTodo;
</script>
</body>
</html>
