<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retorno de Equipos | Next Gen UI</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --accent: #00f2ff;
            --bg: #020617;
            --sidebar-bg: rgba(9, 9, 11, 0.95);
            --card-bg: rgba(15, 23, 42, 0.6);
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --success: #22c55e;
            --danger: #ef4444;
            --border: rgba(255, 255, 255, 0.08);
            --transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* FONDO DINÁMICO ATMOSFÉRICO */
        .ambient-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 242, 255, 0.05) 0%, transparent 40%);
            z-index: -1;
        }

        /* --- NUEVO MENÚ ORBITAL FLOTANTE --- */
        .nav-container {
            position: fixed;
            top: 30px;
            left: 30px;
            z-index: 2000;
        }

        .nav-trigger {
            width: 65px;
            height: 65px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 22px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .nav-trigger:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: scale(1.05);
            border-color: var(--primary);
        }

        .burger-line {
            width: 24px;
            height: 2px;
            background: white;
            margin: 3px 0;
            transition: var(--transition);
            border-radius: 2px;
        }

        .nav-trigger.active .line-1 { transform: translateY(8px) rotate(45deg); }
        .nav-trigger.active .line-2 { opacity: 0; transform: translateX(-20px); }
        .nav-trigger.active .line-3 { transform: translateY(-8px) rotate(-45deg); }

        .nav-panel {
            position: absolute;
            top: 80px;
            left: 0;
            width: 280px;
            background: var(--sidebar-bg);
            backdrop-filter: blur(30px);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 25px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-20px) scale(0.95);
            transition: var(--transition);
            box-shadow: 0 40px 80px rgba(0,0,0,0.8);
        }

        .nav-panel.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 20px;
            color: var(--text-dim);
            text-decoration: none;
            font-weight: 700;
            border-radius: 16px;
            transition: var(--transition);
            margin-bottom: 5px;
        }

        .nav-link:hover {
            background: rgba(99, 102, 241, 0.1);
            color: white;
            transform: translateX(8px);
        }

        .logout-wrapper {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border);
        }

        .logout-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px 20px;
            color: var(--danger);
            text-decoration: none;
            font-weight: 800;
            border-radius: 16px;
            background: rgba(239, 68, 68, 0.05);
            transition: var(--transition);
        }

        .logout-btn:hover {
            background: var(--danger);
            color: white;
        }

        /* CONTENIDO PRINCIPAL */
        .main-container {
            width: 100%;
            max-width: 650px;
            padding: 20px;
            z-index: 10;
        }

        .return-card {
            background: var(--card-bg);
            padding: 60px;
            border-radius: 40px;
            border: 1px solid var(--border);
            box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        h2 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -2px;
            margin-bottom: 10px;
            text-align: center;
            background: linear-gradient(to bottom, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            color: var(--text-dim);
            margin-bottom: 50px;
            font-size: 1.1rem;
        }

        /* INPUTS Y SELECT */
        .input-group {
            margin-bottom: 30px;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 12px;
        }

        input, select {
            width: 100%;
            padding: 20px 25px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid var(--border);
            border-radius: 20px;
            color: white;
            font-size: 1.1rem;
            outline: none;
            transition: var(--transition);
        }

        /* Corrección visibilidad opciones select */
        select option {
            background-color: #0f172a;
            color: white;
            padding: 10px;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 22px;
            background: white;
            color: black;
            border: none;
            border-radius: 20px;
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(255, 255, 255, 0.15);
        }

        /* ÉXITO */
        #success-msg {
            display: none;
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 35px;
            background: var(--success);
            color: white;
            border-radius: 100px;
            font-weight: 700;
            z-index: 2000;
        }

        @media (max-width: 600px) {
            h2 { font-size: 2.2rem; }
            .return-card { padding: 40px 20px; }
            .nav-panel { width: calc(100vw - 60px); }
        }
    </style>
</head>
<body>

<div class="ambient-bg"></div>

<!-- NUEVA NAVEGACIÓN ORBITAL INTEGRADA -->
<div class="nav-container">
    <div class="nav-trigger" onclick="toggleNav()">
        <div class="burger-line line-1"></div>
        <div class="burger-line line-2"></div>
        <div class="burger-line line-3"></div>
    </div>

    <div class="nav-panel" id="navPanel">
        <a href="#" class="nav-link" onclick="ir('home')">
            <span style="font-size: 1.2rem;">🏠</span> Inicio
        </a>
        </div>
    </div>
</div>

<main class="main-container">
    <div class="return-card">
        <h2>Devolución</h2>
        <p class="subtitle">Registra el reingreso de equipos al sistema.</p>

        <div class="input-group">
            <label>Código de Préstamo</label>
            <input id="prestamo" type="text" placeholder="Ej: PR-2024" autocomplete="off">
        </div>

        <div class="input-group">
            <label>Condición del Activo</label>
            <select id="estado">
                <option value="Excelente">Estado Impecable</option>
                <option value="Buen estado">Condición Óptima</option>
                <option value="Desgastado">Signos de Uso</option>
                <option value="Requiere mantenimiento">Intervención Técnica</option>
                <option value="Dañado">Fuera de Servicio</option>
            </select>
        </div>

        <button class="btn-submit" onclick="devolver()">PROCESAR REINGRESO</button>
    </div>
</main>

<div id="success-msg">
    TRANSACCIÓN COMPLETADA
</div>

<script>
function toggleNav() {
    const trigger = document.querySelector('.nav-trigger');
    const panel = document.getElementById('navPanel');
    trigger.classList.toggle('active');
    panel.classList.toggle('active');
}

// Cerrar menú al hacer clic fuera
document.addEventListener('click', (e) => {
    const container = document.querySelector('.nav-container');
    const panel = document.getElementById('navPanel');
    if (!container.contains(e.target) && panel.classList.contains('active')) {
        toggleNav();
    }
});

function ir(r) {
    toggleNav();
    setTimeout(() => {
        document.body.style.opacity = '0';
        setTimeout(() => window.location.href = "/home/dashboard.html", 300);
    }, 400);
}

async function devolver() {
    const p = document.getElementById('prestamo');
    const estado = document.getElementById('estado').value;
    const success = document.getElementById('success-msg');
    const btn = document.querySelector('.btn-submit');

    if(!p.value) return;

    btn.innerHTML = "PROCESANDO...";
    btn.disabled = true;

    await fetch('/devoluciones', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            id_prestamo: p.value,
            estado_equipo: estado
        })
    });

    success.style.display = 'block';
    p.value = '';

    setTimeout(() => {
        success.style.display = 'none';
    }, 3000);

    btn.innerHTML = "PROCESAR REINGRESO";
    btn.disabled = false;
}
</script>

</body>
</html>
