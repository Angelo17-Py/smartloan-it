<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="h" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(28,25,23,0.9)"/>
      <stop offset="100%" stop-color="rgba(28,25,23,0.5)"/>
    </linearGradient>
    <filter id="s">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#d97706" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Hexágono exterior con glow -->
  <path d="M50 4 L88 27 L88 73 L50 96 L12 73 L12 27 Z" fill="url(#g)" filter="url(#s)"/>
