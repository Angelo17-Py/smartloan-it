  <path d="M32 65 L50 50 L68 65" fill="none" stroke="url(#g)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  <path d="M27 72 L50 54 L73 72" fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
  <!-- Punto focal -->
  <circle cx="50" cy="46" r="4" fill="#fbbf24" opacity="0.9"/>
