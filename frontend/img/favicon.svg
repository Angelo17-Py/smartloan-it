<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="50%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#1e3a5f" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Cuerpo del favicon -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="4" y="4" width="92" height="46" rx="22" fill="url(#shine)"/>
  <!-- Monitor -->
  <rect x="20" y="24" width="60" height="40" rx="6" fill="none" stroke="white" stroke-width="3.5"/>
  <rect x="32" y="48" width="36" height="2" rx="1" fill="white" opacity="0.4"/>
  <!-- Base del monitor -->
  <path d="M42 64 L42 74 L58 74 L58 64" fill="none" stroke="white" stroke-width="2.8" stroke-linejoin="round" opacity="0.5"/>
  <rect x="38" y="74" width="24" height="3" rx="1.5" fill="white" opacity="0.35"/>
  <!-- Línea de tendencia (gráfico) -->
  <path d="M30 42 L40 34 L50 40 L62 28 L70 34" fill="none" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Punto final del gráfico -->
  <circle cx="70" cy="34" r="2.5" fill="white"/>
</svg>
