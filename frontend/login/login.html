<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema | Premium Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.5);
            --accent: #00f2ff;
            --accent-glow: rgba(0, 242, 255, 0.5);
            --bg: #020617;
            --card-bg: rgba(15, 23, 42, 0.7);
            --text: #ffffff;
            --text-dim: #94a3b8;
            --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: grid;
            place-items: center;
            overflow: hidden;
            position: relative;
        }

        /* FONDO DINÁMICO CON PARTÍCULAS */
        #canvas-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .bg-glow {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 80% 20%, rgba(99, 102, 241, 0.2) 0%, transparent 40%),
                radial-gradient(circle at 20% 80%, rgba(0, 242, 255, 0.15) 0%, transparent 40%);
            z-index: -1;
            filter: blur(80px);
        }

        /* CONTENEDOR LOGIN REDISEÑADO */
        .login-container {
            width: 90%;
            max-width: 500px; /* Más ancho */
            padding: 60px 50px; /* Más padding */
            background: var(--card-bg);
            backdrop-filter: blur(25px) saturate(180%);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 
                0 0 0 1px rgba(255, 255, 255, 0.05),
                0 30px 60px -12px rgba(0, 0, 0, 0.7);
            text-align: center;
            animation: slideUp 1s ease-out;
            position: relative;
            overflow: hidden;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .logo-area {
            margin-bottom: 45px;
        }

        .logo-box {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            width: 80px; /* Más grande */
            height: 80px; /* Más grande */
            border-radius: 24px;
            display: grid;
            place-items: center;
            margin: 0 auto 25px;
            font-size: 40px; /* Icono más grande */
            box-shadow: 0 15px 35px var(--primary-glow);
            animation: pulse-glow 3s infinite;
            position: relative;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 20px var(--primary-glow); transform: scale(1); }
            50% { box-shadow: 0 0 40px var(--accent-glow); transform: scale(1.05); }
            100% { box-shadow: 0 0 20px var(--primary-glow); transform: scale(1); }
        }

        h2 {
            font-size: 2.8rem; /* Título gigante */
            font-weight: 800;
            letter-spacing: -1.5px;
            margin-bottom: 12px;
            background: linear-gradient(to bottom, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 1.1rem; /* Subtítulo más grande */
            margin-bottom: 40px;
            font-weight: 400;
        }

        /* INPUTS MODERNIZADOS */
        .input-group {
            position: relative;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 22px 28px; /* Input muy espacioso */
            background: rgba(15, 23, 42, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            color: white;
            font-size: 1.2rem; /* Letra de input más grande */
            outline: none;
            transition: var(--transition);
            text-align: center;
        }

        input:focus {
            border-color: var(--primary);
            background: rgba(15, 23, 42, 0.8);
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.2);
            transform: translateY(-2px);
        }

        input::placeholder {
            color: #475569;
            opacity: 0.7;
        }

        /* BOTÓN IMPRESIONANTE */
        button {
            width: 100%;
            padding: 22px;
            background: linear-gradient(135deg, var(--primary), #4f46e5);
            border: none;
            border-radius: 20px;
            color: white;
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 15px 30px -10px rgba(99, 102, 241, 0.5);
            overflow: hidden;
            position: relative;
        }

        button::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            transition: 0.8s;
        }

        button:hover::after {
            left: 100%;
        }

        button:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 20px 40px -10px rgba(99, 102, 241, 0.7);
            filter: brightness(1.2);
        }

        button:active {
            transform: translateY(0) scale(0.98);
        }

        /* ERROR ESTILIZADO */
        #error-msg {
            margin-top: 25px;
            font-size: 1rem;
            font-weight: 600;
            color: #fb7185;
            min-height: 24px;
            opacity: 0;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* DECORACIÓN FOOTER */
        .footer-text {
            margin-top: 40px;
            font-size: 0.9rem;
            color: var(--text-dim);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            opacity: 0.5;
        }

        /* ANIMACIÓN DE ERROR SHAKE */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-10px); }
            80% { transform: translateX(10px); }
        }

        .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }

    </style>
</head>
<body>

<canvas id="canvas-particles"></canvas>
<div class="bg-glow"></div>

<div class="login-container">
    <div class="logo-area">
        <div class="logo-box">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
            </svg>
        </div>
        <h2>SmartLoan IT</h2>
        <p class="subtitle"></p>
    </div>

    <div class="input-group">
        <input type="text" id="cedula" placeholder="Número de Identidad" autocomplete="off" maxlength="15">
    </div>
    
    <button id="loginBtn" onclick="login()">
        <span>Acceder Ahora</span>
    </button>

    <div id="error-msg">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        <span id="error-text">Usuario no encontrado</span>
    </div>

    <p class="footer-text">© 2026 Angelo Caballero. Todos los derechos reservados.
Este sistema fue desarrollado como parte del proyecto académico de la carrera de Ingeniería en Informática.</p>
</div>

<script>
// --- EFECTO DE PARTÍCULAS ---
const canvas = document.getElementById('canvas-particles');
const ctx = canvas.getContext('2d');
let particles = [];

function initParticles() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    particles = [];
    for(let i = 0; i < 60; i++) {
        particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2 + 1,
            speedX: (Math.random() - 0.5) * 0.5,
            speedY: (Math.random() - 0.5) * 0.5,
            opacity: Math.random() * 0.5
        });
    }
}

function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
        p.x += p.speedX;
        p.y += p.speedY;
        if(p.x < 0 || p.x > canvas.width) p.speedX *= -1;
        if(p.y < 0 || p.y > canvas.height) p.speedY *= -1;
        
        ctx.fillStyle = `rgba(99, 102, 241, ${p.opacity})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    });
    requestAnimationFrame(animateParticles);
}

window.addEventListener('resize', initParticles);
initParticles();
animateParticles();

// --- LÓGICA DE LOGIN ---
async function login() {
    const cedulaInput = document.getElementById('cedula');
    const btn = document.getElementById('loginBtn');
    const errorMsg = document.getElementById('error-msg');
    const errorText = document.getElementById('error-text');

    if (!cedulaInput.value) {
        showError("Ingrese su credencial");
        return;
    }

    // Efecto visual de carga premium
    btn.disabled = true;
    btn.style.filter = "grayscale(0.5)";
    btn.innerHTML = `<span>Procesando...</span>`;
    errorMsg.style.opacity = "0";

    try {
        // Simulamos una latencia para que se vea el efecto "wow" del procesamiento
        await new Promise(r => setTimeout(r, 1200));

        const res = await fetch('/usuarios/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ cedula: cedulaInput.value })
        });

        const data = await res.json();

        if (data.id_usuario) {
            localStorage.setItem('usuario', JSON.stringify(data));
            
            // Transición de éxito expansiva
            const container = document.querySelector('.login-container');
            container.style.transition = "all 0.8s cubic-bezier(0.7, 0, 0.3, 1)";
            container.style.opacity = "0";
            container.style.transform = "scale(1.2) translateY(-20px)";
            container.style.filter = "blur(20px)";
            
            setTimeout(() => {
                window.location.href = "/home/dashboard.html";
            }, 600);
        } else {
            showError("Identidad no reconocida");
        }
    } catch (err) {
        showError("Fallo de conexión encriptada");
    } finally {
        if (!errorMsg.style.opacity || errorMsg.style.opacity == "0") {
            btn.innerHTML = "<span>Acceder Ahora</span>";
            btn.disabled = false;
            btn.style.filter = "none";
        }
    }
}

function showError(msg) {
    const errorMsg = document.getElementById('error-msg');
    const errorText = document.getElementById('error-text');
    const container = document.querySelector('.login-container');
    const btn = document.getElementById('loginBtn');

    errorText.innerText = msg;
    errorMsg.style.opacity = "1";
    
    // Reset botón
    btn.innerHTML = "<span>Reintentar</span>";
    btn.disabled = false;
    btn.style.filter = "none";

    // Vibración visual
    container.classList.remove('shake');
    void container.offsetWidth; // trigger reflow
    container.classList.add('shake');
}

// Enter Key
document.getElementById('cedula').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') login();
});
</script>

</body>
</html>
