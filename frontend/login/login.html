<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartLoan IT | Acceso</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary:#6366f1; --accent:#00f2ff; --danger:#ef4444; --bg:#020617; --card-bg:rgba(15,23,42,0.7); --text:#fff; --text-dim:#94a3b8; --border:rgba(255,255,255,0.08); }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans',sans-serif; }
        body { background:var(--bg); color:var(--text); height:100vh; display:grid; place-items:center; overflow:hidden; }
        #canvas { position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1; }
        .bg-glow { position:fixed; top:0; left:0; width:100%; height:100%; background:radial-gradient(circle at 80% 20%,rgba(99,102,241,0.2) 0%,transparent 40%),radial-gradient(circle at 20% 80%,rgba(0,242,255,0.15) 0%,transparent 40%); z-index:-1; filter:blur(80px); }
        .box { width:90%; max-width:440px; padding:55px 45px; background:var(--card-bg); backdrop-filter:blur(25px); border-radius:40px; border:1px solid rgba(255,255,255,0.12); box-shadow:0 30px 60px -12px rgba(0,0,0,0.7); text-align:center; animation:up 0.8s ease-out; }
        @keyframes up { from{opacity:0;transform:translateY(40px) scale(0.95)} to{opacity:1;transform:translateY(0) scale(1)} }
        .logo { background:linear-gradient(135deg,var(--primary),var(--accent)); width:74px; height:74px; border-radius:22px; display:grid; place-items:center; margin:0 auto 20px; animation:glow 3s infinite; }
        @keyframes glow { 0%,100%{box-shadow:0 0 20px rgba(99,102,241,0.5)} 50%{box-shadow:0 0 40px rgba(0,242,255,0.5)} }
        h2 { font-size:2.2rem; font-weight:800; letter-spacing:-1.5px; margin-bottom:5px; background:linear-gradient(to bottom,#fff,#94a3b8); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .sub { color:var(--text-dim); font-size:0.88rem; margin-bottom:8px; }
        .badge { display:inline-block; background:rgba(99,102,241,0.1); border:1px solid rgba(99,102,241,0.2); border-radius:100px; padding:5px 14px; font-size:0.74rem; color:var(--primary); font-weight:700; margin-bottom:28px; }
        .field { margin-bottom:14px; text-align:left; }
        .field label { display:block; font-size:0.72rem; text-transform:uppercase; letter-spacing:1.5px; color:var(--text-dim); font-weight:700; margin-bottom:7px; }
        .field input { width:100%; padding:17px 20px; background:rgba(15,23,42,0.5); border:2px solid rgba(255,255,255,0.06); border-radius:15px; color:white; font-size:1.05rem; outline:none; font-family:'Plus Jakarta Sans',sans-serif; transition:0.3s; }
        .field input:focus { border-color:var(--primary); box-shadow:0 0 0 4px rgba(99,102,241,0.15); }
        .field input.error { border-color:var(--danger); box-shadow:0 0 0 4px rgba(239,68,68,0.15); }
        .field input::placeholder { color:#475569; }
        .field-err { font-size:0.78rem; color:var(--danger); margin-top:6px; display:none; }
        .field-err.show { display:block; }
        .pass-wrap { position:relative; }
        .pass-wrap input { padding-right:48px; }
        .eye { position:absolute; right:14px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:var(--text-dim); font-size:1rem; }
        .eye:hover { color:white; }
        .btn { width:100%; padding:18px; background:linear-gradient(135deg,var(--primary),#4f46e5); border:none; border-radius:15px; color:white; font-size:1.05rem; font-weight:800; cursor:pointer; transition:0.3s; text-transform:uppercase; letter-spacing:1px; font-family:'Plus Jakarta Sans',sans-serif; margin-top:6px; }
        .btn:hover { transform:translateY(-3px); box-shadow:0 20px 40px -10px rgba(99,102,241,0.7); }
        .btn:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
        .err { margin-top:14px; font-size:0.87rem; font-weight:600; color:#fb7185; opacity:0; transition:0.3s; display:flex; align-items:center; justify-content:center; gap:7px; }
        .footer { margin-top:26px; font-size:0.72rem; color:var(--text-dim); opacity:0.4; line-height:1.6; }
        @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-8px)} 80%{transform:translateX(8px)} }
        .shake { animation:shake 0.45s both; }
    </style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="bg-glow"></div>
<div class="box" id="box">
    <div class="logo"><svg width="35" height="35" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></div>
    <h2>SmartLoan IT</h2>
    <p class="sub">Sistema de Gestión de Recursos Tecnológicos</p>
    <div class="badge">Universidad Integracion de las Americas</div>
    <div class="field">
        <label>Código (máx. 4 dígitos)</label>
        <input type="text" id="codigo" placeholder="Ej: 1234" maxlength="4" inputmode="numeric" autocomplete="off">
        <div class="field-err" id="err-codigo">Ingresá tu código de encargado</div>
    </div>
    <div class="field">
        <label>Contraseña</label>
        <div class="pass-wrap">
            <input type="password" id="password" placeholder="••••••••" autocomplete="off">
            <button class="eye" type="button" onclick="togglePass()" id="eyeBtn">&#128065;</button>
        </div>
        <div class="field-err" id="err-pass">Ingresá tu contraseña</div>
    </div>
    <button class="btn" id="btn" onclick="login()">Acceder al Sistema</button>
    <div class="err" id="err">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="errTxt"></span>
    </div>
    <p class="footer">© 2026 Angelo Caballero — Proyecto de Grado · Ing. en Informática</p>
</div>
<script>
const API='http://localhost:3000';
const cv=document.getElementById('canvas'),cx=cv.getContext('2d');let pp=[];
function ip(){cv.width=innerWidth;cv.height=innerHeight;pp=[];for(let i=0;i<60;i++)pp.push({x:Math.random()*cv.width,y:Math.random()*cv.height,s:Math.random()*2+1,sx:(Math.random()-.5)*.5,sy:(Math.random()-.5)*.5,o:Math.random()*.5});}
function ap(){cx.clearRect(0,0,cv.width,cv.height);pp.forEach(p=>{p.x+=p.sx;p.y+=p.sy;if(p.x<0||p.x>cv.width)p.sx*=-1;if(p.y<0||p.y>cv.height)p.sy*=-1;cx.fillStyle=`rgba(99,102,241,${p.o})`;cx.beginPath();cx.arc(p.x,p.y,p.s,0,Math.PI*2);cx.fill();});requestAnimationFrame(ap);}
window.addEventListener('resize',ip);ip();ap();

document.getElementById('codigo').addEventListener('input',function(){
    this.value=this.value.replace(/[^0-9]/g,'');
    clearErr('codigo');
});
document.getElementById('password').addEventListener('input',function(){ clearErr('pass'); });

function togglePass(){const i=document.getElementById('password'),b=document.getElementById('eyeBtn');i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'&#128065;':'&#128584;';}

function clearErr(field){
    document.getElementById('err-'+field).classList.remove('show');
    document.getElementById(field==='pass'?'password':'codigo').classList.remove('error');
}

function validar(){
    let ok=true;
    const codigo=document.getElementById('codigo').value.trim();
    const pass=document.getElementById('password').value;
    if(!codigo){document.getElementById('err-codigo').classList.add('show');document.getElementById('codigo').classList.add('error');ok=false;}
    if(!pass){document.getElementById('err-pass').classList.add('show');document.getElementById('password').classList.add('error');ok=false;}
    return ok;
}

async function login(){
    document.getElementById('err').style.opacity='0';
    if(!validar()) return;
    const codigo=document.getElementById('codigo').value.trim();
    const password=document.getElementById('password').value;
    const btn=document.getElementById('btn');
    btn.disabled=true; btn.textContent='Verificando...';
    try{
        await new Promise(r=>setTimeout(r,600));
        const res=await fetch(`${API}/encargados/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({codigo,password})});
        const data=await res.json();
        if(res.ok&&data.id_encargado){
            localStorage.setItem('encargado',JSON.stringify(data));
            const b=document.getElementById('box');
            b.style.transition='0.7s';b.style.opacity='0';b.style.transform='scale(1.08) translateY(-20px)';
            setTimeout(()=>window.location.href='/home/dashboard.html',580);
        }else{
            document.getElementById('errTxt').textContent=data.mensaje||'Código o contraseña incorrectos';
            document.getElementById('err').style.opacity='1';
            btn.textContent='Reintentar'; btn.disabled=false;
            const b=document.getElementById('box');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');
        }
    }catch(e){
        document.getElementById('errTxt').textContent='Error de conexión con el servidor';
        document.getElementById('err').style.opacity='1';
        btn.textContent='Reintentar'; btn.disabled=false;
    }
}
document.getElementById('codigo').addEventListener('keypress',e=>{if(e.key==='Enter')document.getElementById('password').focus();});
document.getElementById('password').addEventListener('keypress',e=>{if(e.key==='Enter')login();});
</script>
</body>
</html>
