<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%236366f1'/><stop offset='100%25' stop-color='%2300f2ff'/></linearGradient></defs><rect width='100' height='100' rx='22' fill='url(%23g)'/><path d='M50 20 L20 35 L50 50 L80 35 Z' fill='white'/><path d='M20 50 L50 65 L80 50' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/><path d='M20 63 L50 78 L80 63' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/></svg>">
    <title>SmartLoan IT | Acceso</title>
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/components.css">
    <script src="/js/utils.js" defer></script>
    <style>
        .login-page{display:grid;place-items:center;min-height:100vh;overflow:hidden;background:var(--bg)}
        .bg-glow{position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(600px circle at 30% 40%,rgba(99,102,241,0.12),transparent 70%),radial-gradient(400px circle at 70% 60%,rgba(0,242,255,0.08),transparent 70%)}
        #canvas{position:fixed;inset:0;z-index:-1;pointer-events:none}
        .box{background:var(--card);backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:22px;padding:40px;width:100%;max-width:420px;box-shadow:0 8px 32px rgba(0,0,0,0.4);text-align:center;animation:up 0.6s cubic-bezier(0.16,1,0.3,1) both;position:relative}
        @keyframes up{from{opacity:0;transform:translateY(24px) scale(0.97)}to{opacity:1;transform:translateY(0) scale(1)}}
        @keyframes shake{0%,100%{transform:translateX(0)}10%,30%,50%,70%,90%{transform:translateX(-6px)}20%,40%,60%,80%{transform:translateX(6px)}}
        .shake{animation:shake 0.4s ease}
        .logo{text-align:center;margin-bottom:24px}
        .logo svg{width:48px;height:48px;filter:drop-shadow(0 0 20px rgba(99,102,241,0.4));animation:glow 3s ease-in-out infinite;background:linear-gradient(135deg,var(--primary),#8b5cf6);border-radius:14px;padding:8px;color:#fff}
        @keyframes glow{0%,100%{filter:drop-shadow(0 0 20px rgba(99,102,241,0.4))}50%{filter:drop-shadow(0 0 40px rgba(99,102,241,0.6))}}
        .box h2{font-size:24px;font-weight:800;letter-spacing:-0.5px;margin-bottom:4px}
        .sub{font-size:13px;color:var(--dim);margin-bottom:8px}
        .login-badge{display:inline-block;background:rgba(99,102,241,0.12);color:var(--primary);padding:4px 14px;border-radius:100px;font-size:11px;font-weight:700;margin-bottom:24px}
        .field{text-align:left;margin-bottom:16px}
        .field label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--dim);margin-bottom:6px}
        .field input{width:100%;padding:12px 14px;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;font-family:var(--font);outline:none;transition:all 0.25s}
        .field input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-glow)}
        .field input.error{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-bg)}
        .field-err{display:none;font-size:10px;color:var(--danger);margin-top:4px;font-weight:600}
        .field-err.show{display:block}
        .pass-wrap{position:relative}
        .pass-wrap input{padding-right:44px}
        .eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--dim);cursor:pointer;padding:6px;border-radius:6px;display:flex;transition:color 0.2s}
        .eye:hover{color:var(--text)}
        .box .btn{width:100%;padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--primary),#8b5cf6);color:#fff;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:1px;cursor:pointer;transition:all 0.3s cubic-bezier(0.16,1,0.3,1);margin-top:4px}
        .box .btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.35)}
        .box .btn:disabled{opacity:0.5;cursor:not-allowed;transform:none!important}
        .err{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;font-size:12px;color:var(--danger);opacity:0;transition:opacity 0.3s}
        .footer{text-align:center;margin-top:20px;font-size:10px;color:var(--dim);opacity:0.4}
        @media(max-width:480px){.box{padding:28px 20px;margin:16px;border-radius:16px}}
    </style>
</head>
<body class="login-page">
<canvas id="canvas"></canvas>
<div class="bg-glow"></div>
<div class="box" id="box">
    <div class="logo"><svg width="35" height="35" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></div>
    <h2>SmartLoan IT</h2>
    <p class="sub">Sistema de Gestión de Recursos Tecnológicos</p>
    <div class="login-badge">Universidad Integración de las Américas</div>
    <div class="field">
        <label>Datos</label>
        <input type="text" id="codigo" placeholder="Código" maxlength="4" inputmode="numeric" autocomplete="off">
        <div class="field-err" id="err-codigo">Ingresá tu código de encargado</div>
    </div>
    <div class="field">
        <label>Contraseña</label>
        <div class="pass-wrap">
            <input type="password" id="password" placeholder="••••••••" autocomplete="off">
            <button class="eye" type="button" onclick="togglePass()" id="eyeBtn" aria-label="Ver contraseña">
                <svg id="eye-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
            </button>
        </div>
        <div class="field-err" id="err-pass">Ingresá tu contraseña</div>
    </div>
    <button class="btn" id="btn" onclick="login()">Acceder al Sistema</button>
    <div class="err" id="err">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="errTxt"></span>
    </div>
    <p class="footer">© 2026 Angelo Caballero — Proyecto de Grado · Ing. en Informática</p>
</div>
<script src="/js/api.js"></script>
<script>
const cv=document.getElementById('canvas'),cx=cv.getContext('2d');let pp=[];
function ip(){cv.width=innerWidth;cv.height=innerHeight;pp=[];for(let i=0;i<60;i++)pp.push({x:Math.random()*cv.width,y:Math.random()*cv.height,s:Math.random()*2+1,sx:(Math.random()-.5)*.5,sy:(Math.random()-.5)*.5,o:Math.random()*.5});}
function ap(){cx.clearRect(0,0,cv.width,cv.height);pp.forEach(p=>{p.x+=p.sx;p.y+=p.sy;if(p.x<0||p.x>cv.width)p.sx*=-1;if(p.y<0||p.y>cv.height)p.sy*=-1;cx.fillStyle=`rgba(99,102,241,${p.o})`;cx.beginPath();cx.arc(p.x,p.y,p.s,0,Math.PI*2);cx.fill();});requestAnimationFrame(ap);}
window.addEventListener('resize',ip);ip();ap();

document.getElementById('codigo').addEventListener('input',function(){
    this.value=this.value.replace(/[^0-9]/g,'');
    clearErr('codigo');
});
document.getElementById('password').addEventListener('input',function(){ clearErr('pass'); });

function togglePass(){
    var inp = document.getElementById('password');
    var svg = document.getElementById('eye-svg');
    if(inp.type === 'password'){
        inp.type = 'text';
        svg.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
    } else {
        inp.type = 'password';
        svg.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    }
}

function clearErr(field){
    document.getElementById('err-'+field).classList.remove('show');
    document.getElementById(field==='pass'?'password':'codigo').classList.remove('error');
}

function validar(){
    let ok=true;
    const codigo=document.getElementById('codigo').value.trim();
    const pass=document.getElementById('password').value;
    if(!codigo){document.getElementById('err-codigo').classList.add('show');document.getElementById('codigo').classList.add('error');ok=false;}
    if(!pass){document.getElementById('err-pass').classList.add('show');document.getElementById('password').classList.add('error');ok=false;}
    return ok;
}

async function login(){
    document.getElementById('err').style.opacity='0';
    if(!validar()) return;
    const codigo=document.getElementById('codigo').value.trim();
    const password=document.getElementById('password').value;
    const btn=document.getElementById('btn');
    btn.disabled=true; btn.textContent='Verificando...';
    try{
        await new Promise(r=>setTimeout(r,600));
        const res=await apiFetch('/encargados/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({codigo,password})});
        const data=await res.json();
        if(res.ok&&data.token){
            localStorage.setItem('token',data.token);
            localStorage.setItem('encargado',JSON.stringify(data.usuario));
            const b=document.getElementById('box');
            b.style.transition='0.7s';b.style.opacity='0';b.style.transform='scale(1.08) translateY(-20px)';
            setTimeout(()=>window.location.href='/home/dashboard.html',580);
        }else{
            document.getElementById('errTxt').textContent=data.mensaje||'Código o contraseña incorrectos';
            document.getElementById('err').style.opacity='1';
            btn.textContent='Reintentar'; btn.disabled=false;
            const b=document.getElementById('box');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');
        }
    }catch(e){
        document.getElementById('errTxt').textContent='Error de conexión con el servidor';
        document.getElementById('err').style.opacity='1';
        btn.textContent='Reintentar'; btn.disabled=false;
    }
}
document.getElementById('codigo').addEventListener('keypress',e=>{if(e.key==='Enter')document.getElementById('password').focus();});
document.getElementById('password').addEventListener('keypress',e=>{if(e.key==='Enter')login();});
document.addEventListener('DOMContentLoaded',initTheme);
</script>
</body>
</html>
