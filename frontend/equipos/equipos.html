<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario de Equipos | Premium Plus</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --accent: #00f2ff;
            --bg: #030712;
            --sidebar-bg: rgba(9, 9, 11, 0.95);
            --card-bg: rgba(30, 41, 59, 0.4);
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
            --border: rgba(255, 255, 255, 0.08);
            --transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }

        /* FONDO DINÁMICO */
        .bg-glow {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.12) 0%, transparent 50%);
            z-index: -1;
        }

        /* --- NUEVO MENÚ ORBITAL FLOTANTE --- */
        .nav-container {
            position: fixed;
            top: 30px;
            left: 30px;
            z-index: 2000;
        }

        .nav-trigger {
            width: 65px;
            height: 65px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 22px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .nav-trigger:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: scale(1.05);
            border-color: var(--primary);
        }

        .burger-line {
            width: 24px;
            height: 2px;
            background: white;
            margin: 3px 0;
            transition: var(--transition);
            border-radius: 2px;
        }

        .nav-trigger.active .line-1 { transform: translateY(8px) rotate(45deg); }
        .nav-trigger.active .line-2 { opacity: 0; transform: translateX(-20px); }
        .nav-trigger.active .line-3 { transform: translateY(-8px) rotate(-45deg); }

        .nav-panel {
            position: absolute;
            top: 80px;
            left: 0;
            width: 280px;
            background: var(--sidebar-bg);
            backdrop-filter: blur(30px);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 25px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-20px) scale(0.95);
            transition: var(--transition);
            box-shadow: 0 40px 80px rgba(0,0,0,0.8);
        }

        .nav-panel.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 20px;
            color: var(--text-dim);
            text-decoration: none;
            font-weight: 700;
            border-radius: 16px;
            transition: var(--transition);
            margin-bottom: 5px;
        }

        .nav-link:hover {
            background: rgba(99, 102, 241, 0.1);
            color: white;
            transform: translateX(8px);
        }

        .logout-wrapper {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border);
        }

        .logout-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px 20px;
            color: var(--danger);
            text-decoration: none;
            font-weight: 800;
            border-radius: 16px;
            background: rgba(239, 68, 68, 0.05);
            transition: var(--transition);
        }

        .logout-btn:hover {
            background: var(--danger);
            color: white;
        }

        /* --- CONTENIDO AJUSTADO (SIN MARGEN SIDEBAR) --- */
        .content {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 120px 40px 60px;
            transition: var(--transition);
        }

        h2 {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -2px;
            margin-bottom: 50px;
            background: linear-gradient(to right, #fff, var(--text-dim));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 32px;
            border: 1px solid var(--border);
            display: flex;
            gap: 25px;
            align-items: flex-end;
            margin-bottom: 60px;
            flex-wrap: wrap;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
            min-width: 250px;
        }

        .input-group label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--primary);
            font-weight: 800;
        }

        input {
            width: 100%;
            padding: 18px 22px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid var(--border);
            border-radius: 16px;
            color: white;
            font-size: 1.05rem;
            outline: none;
            transition: var(--transition);
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 5px rgba(99, 102, 241, 0.15);
        }

        .btn-add {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 40px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: var(--transition);
            height: 62px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-add:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(99, 102, 241, 0.3);
        }

        .table-container {
            background: var(--card-bg);
            border-radius: 32px;
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            padding: 25px 35px;
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-dim);
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-align: left;
        }

        td {
            padding: 25px 35px;
            border-bottom: 1px solid var(--border);
            font-size: 1.1rem;
        }

        .badge {
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .badge-disponible { background: rgba(34, 197, 94, 0.1); color: var(--success); border: 1px solid rgba(34, 197, 94, 0.2); }
        .badge-prestado { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2); }

        .btn-delete {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
            width: 40px;
            height: 40px;
            border-radius: 10px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 1.2rem;
        }

        .btn-delete:hover {
            background: var(--danger);
            color: white;
            transform: rotate(90deg);
        }

        @media (max-width: 900px) {
            .form-card { flex-direction: column; align-items: stretch; }
            h2 { font-size: 2.5rem; }
            .content { padding: 100px 20px; }
        }
    </style>
</head>
<body>

<div class="bg-glow"></div>

<!-- NAVEGACIÓN ORBITAL FLOTANTE -->
<div class="nav-container">
    <div class="nav-trigger" onclick="toggleNav()">
        <div class="burger-line line-1"></div>
        <div class="burger-line line-2"></div>
        <div class="burger-line line-3"></div>
    </div>

    <div class="nav-panel" id="navPanel">
        <a href="#" class="nav-link" onclick="ir('home')">
            <span style="font-size: 1.2rem;">🏠</span> Inicio
        </a>
       
    </div>
</div>

<main class="content">
    <h2>Gestión de Equipos</h2>

    <div class="form-card">
        <div class="input-group">
            <label>Nombre del Equipo</label>
            <input id="nombre" placeholder="Ej: MacBook Pro M2">
        </div>
        <div class="input-group">
            <label>Categoría / Tipo</label>
            <input id="tipo" placeholder="Ej: Laptop">
        </div>
        <div class="input-group">
            <label>Marca</label>
            <input id="marca" placeholder="Ej: Apple">
        </div>
        <button class="btn-add" onclick="crear()">
            Agregar Equipo
        </button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre y Detalles</th>
                    <th>Estado</th>
                    <th style="text-align: center;">Acción</th>
                </tr>
            </thead>
            <tbody id="tabla">
                <!-- Se cargará mediante JS -->
            </tbody>
        </table>
    </div>
</main>

<script>
function toggleNav() {
    const trigger = document.querySelector('.nav-trigger');
    const panel = document.getElementById('navPanel');
    trigger.classList.toggle('active');
    panel.classList.toggle('active');
}

// Cerrar menú al hacer clic fuera
document.addEventListener('click', (e) => {
    const container = document.querySelector('.nav-container');
    const panel = document.getElementById('navPanel');
    if (!container.contains(e.target) && panel.classList.contains('active')) {
        toggleNav();
    }
});

function ir(r) { 
    toggleNav();
    document.body.style.opacity = '0';
    setTimeout(() => {
        window.location.href = "/home/dashboard.html"; 
    }, 300);
}

let equiposMock = [
    { id_equipo: 101, nombre: 'MacBook Pro M2', tipo: 'Laptop', marca: 'Apple', estado: 'Disponible' },
    { id_equipo: 102, nombre: 'Dell XPS 15', tipo: 'Laptop', marca: 'Dell', estado: 'Prestado' }
];

async function cargar() {
    const tabla = document.getElementById('tabla');
    let data = equiposMock;

    try {
        const res = await fetch('/equipos');
        if (res.ok) data = await res.json();
    } catch(e) {}

    if(data.length === 0) {
        tabla.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:50px; color:var(--text-dim)">No hay equipos</td></tr>`;
        return;
    }

    tabla.innerHTML = data.map(e => `
        <tr>
            <td style="color:var(--primary); font-weight:800; font-family:monospace;">#${e.id_equipo}</td>
            <td>
                <div style="font-weight:700; color:white;">${e.nombre}</div>
                <div style="font-size:0.9rem; color:var(--text-dim)">${e.tipo} • ${e.marca}</div>
            </td>
            <td>
                <span class="badge ${e.estado.toLowerCase() === 'disponible' ? 'badge-disponible' : 'badge-prestado'}">
                    ${e.estado}
                </span>
            </td>
            <td style="text-align: center;">
                <button class="btn-delete" onclick="eliminar(${e.id_equipo})">&times;</button>
            </td>
        </tr>
    `).join('');
}

async function crear() {
    const n = document.getElementById('nombre');
    const t = document.getElementById('tipo');
    const m = document.getElementById('marca');

    if(!n.value) {
        n.style.borderColor = 'var(--danger)';
        setTimeout(() => n.style.borderColor = '', 2000);
        return;
    }

    const nuevo = { id_equipo: Math.floor(Math.random()*900)+100, nombre: n.value, tipo: t.value || 'N/A', marca: m.value || 'Genérico', estado: 'Disponible' };
    equiposMock.push(nuevo);
    
    n.value = ''; t.value = ''; m.value = '';
    cargar();
}

async function eliminar(id) {
    if(!confirm("¿Eliminar equipo?")) return;
    equiposMock = equiposMock.filter(e => e.id_equipo !== id);
    cargar();
}

window.onload = cargar;
</script>

</body>
</html>
