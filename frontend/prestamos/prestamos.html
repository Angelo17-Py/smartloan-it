<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Préstamos | Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --accent: #00f2ff;
            --bg: #030712;
            --sidebar-bg: rgba(9, 9, 11, 0.95);
            --card-bg: rgba(30, 41, 59, 0.4);
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --warning: #f59e0b;
            --border: rgba(255, 255, 255, 0.08);
            --transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .bg-glow {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.1) 0%, transparent 50%);
            z-index: -1;
        }

        .nav-container {
            position: fixed;
            top: 30px;
            left: 30px;
            z-index: 2000;
        }

        .nav-trigger {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 22px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        /* 🔥 SELECT IGUAL QUE INPUT */
select {
    width: 100%;
    padding: 18px 22px;
    background: rgba(0, 0, 0, 0.3);
    border: 2px solid var(--border);
    border-radius: 18px;
    color: white;
    font-size: 1.1rem;
    outline: none;
    transition: var(--transition);

    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
}

/* Flecha personalizada */
select {
    background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg fill='white' height='20' viewBox='0 0 24 24' width='20' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M7 10l5 5 5-5z'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 15px center;
}

/* Opciones */
select option {
    background-color: #0f172a;
    color: white;
}

/* Focus igual a tus inputs */
select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 20px rgba(99, 102, 241, 0.15);
}

        .nav-trigger:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: scale(1.05);
            border-color: var(--primary);
        }

        .burger-line {
            width: 28px;
            height: 2px;
            background: white;
            margin: 3.5px 0;
            transition: var(--transition);
            border-radius: 2px;
        }

        .nav-trigger.active .line-1 { transform: translateY(9px) rotate(45deg); }
        .nav-trigger.active .line-2 { opacity: 0; transform: translateX(-20px); }
        .nav-trigger.active .line-3 { transform: translateY(-9px) rotate(-45deg); }

        .nav-panel {
            position: absolute;
            top: 85px;
            left: 0;
            width: 300px;
            background: var(--sidebar-bg);
            backdrop-filter: blur(30px);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 25px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-20px) scale(0.95);
            transition: var(--transition);
            box-shadow: 0 40px 80px rgba(0,0,0,0.8);
        }

        .nav-panel.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 18px 22px;
            color: var(--text-dim);
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            border-radius: 18px;
            transition: var(--transition);
            margin-bottom: 8px;
            cursor: pointer;
        }

        .nav-link:hover {
            background: rgba(99, 102, 241, 0.15);
            color: white;
            transform: translateX(10px);
        }

        .nav-link span { font-size: 1.5rem; }

        .content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 120px 40px 60px;
        }

        h2 {
            font-size: 3.8rem;
            font-weight: 800;
            letter-spacing: -2px;
            margin-bottom: 50px;
            background: linear-gradient(to bottom, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 45px;
            border-radius: 32px;
            border: 1px solid var(--border);
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 25px;
            align-items: flex-end;
            margin-bottom: 60px;
            box-shadow: 0 30px 60px -12px rgba(0,0,0,0.5);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-group label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent);
            font-weight: 800;
        }

        input {
            width: 100%;
            padding: 18px 22px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid var(--border);
            border-radius: 18px;
            color: white;
            font-size: 1.1rem;
            outline: none;
            transition: var(--transition);
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.15);
        }

        .btn-action {
            background: white;
            color: black;
            border: none;
            padding: 0 40px;
            border-radius: 18px;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            transition: var(--transition);
            height: 60px;
        }

        .btn-action:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(255, 255, 255, 0.1);
        }

        .table-container {
            background: var(--card-bg);
            border-radius: 32px;
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.6);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        thead {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-dim);
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 2px;
        }

        th { padding: 30px; }
        td { 
            padding: 30px; 
            border-bottom: 1px solid var(--border); 
            font-size: 1.1rem;
        }

        .badge-status {
            padding: 8px 18px;
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 700;
            background: rgba(245, 158, 11, 0.1);
            color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        .empty-state {
            padding: 80px;
            text-align: center;
            color: var(--text-dim);
            font-size: 1.2rem;
        }

        @media (max-width: 1100px) {
            .form-card { grid-template-columns: 1fr 1fr; }
            h2 { font-size: 2.8rem; }
        }

        @media (max-width: 600px) {
            .form-card { grid-template-columns: 1fr; padding: 30px; }
            .content { padding: 120px 20px 40px; }
        }
    </style>
</head>
<body>

<div class="bg-glow"></div>

<div class="nav-container">
    <div class="nav-trigger" onclick="toggleNav()">
        <div class="burger-line line-1"></div>
        <div class="burger-line line-2"></div>
        <div class="burger-line line-3"></div>
    </div>

    <div class="nav-panel" id="navPanel">
        <a class="nav-link" onclick="ir('home')">
            <span>🏠</span> Inicio
        </a>
    </div>
</div>

<main class="content">
    <h2>Registro de Préstamos</h2>

    <div class="form-card">
        <div class="input-group">
            <label>ID Usuario</label>
            <input id="usuario" placeholder="Cédula del solicitante" autocomplete="off">
        </div>
        <div class="input-group">
            <label>ID Equipo</label>
            <select id="equipo">
                <option value="">Seleccionar equipo</option>
            </select>
        </div>
        <div class="input-group">
            <label>Fecha Estimada</label>
            <input type="date" id="fecha">
        </div>
        <button class="btn-action" onclick="prestar()">Registrar Salida</button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID Préstamo</th>
                    <th>Equipo Asignado</th>
                    <th>Estado</th>
                    <th>Vencimiento</th>
                </tr>
            </thead>
            <tbody id="tabla"></tbody>
        </table>
    </div>
</main>

<script>
let prestamosData = [];

function toggleNav() {
    const trigger = document.querySelector('.nav-trigger');
    const panel = document.getElementById('navPanel');
    trigger.classList.toggle('active');
    panel.classList.toggle('active');
}

document.addEventListener('click', (e) => {
    const container = document.querySelector('.nav-container');
    const panel = document.getElementById('navPanel');
    if (!container.contains(e.target) && panel.classList.contains('active')) {
        toggleNav();
    }
});

async function cargarEquipos() {
    const select = document.getElementById('equipo');

    try {
        const res = await fetch('/equipos');
        const data = await res.json();

        select.innerHTML = '<option value="">Seleccionar equipo</option>';

        data.forEach(e => {
            const option = document.createElement('option');
            option.value = e.id_equipo;
            option.textContent = `${e.nombre} (${e.marca})`;
            select.appendChild(option);
        });

    } catch (err) {
        console.error('Error cargando equipos', err);
    }
}

function ir(vista) {
    toggleNav();
    document.body.style.opacity = '0.5';
    setTimeout(() => {
        if (vista === 'home') {
            window.location.href = '../home/dashboard.html';
        }
    }, 300);
}

function cargar() {
    const tabla = document.getElementById('tabla');
    
    if (prestamosData.length === 0) {
        tabla.innerHTML = `<tr><td colspan="4" class="empty-state">No hay registros de préstamos activos.</td></tr>`;
        return;
    }

    tabla.innerHTML = prestamosData.map(p => `
        <tr>
            <td style="font-weight: 800; color: var(--accent); font-size: 1.2rem;">#PR-${p.id_prestamo}</td>
            <td>
                <div style="font-weight: 700; font-size: 1.2rem; color: white;">${p.equipo}</div>
                <div style="font-size: 0.9rem; color: var(--text-dim); margin-top: 4px;">Asignado a: ${p.usuario || 'N/A'}</div>
            </td>
            <td><span class="badge-status">${p.estado}</span></td>
            <td style="font-family: monospace; font-size: 1.1rem; font-weight: 600; color: var(--text-dim);">
                ${p.vencimiento || '-- / -- / --'}
            </td>
        </tr>
    `).join('');
}

async function prestar() {
    const u = document.getElementById('usuario');
    const e = document.getElementById('equipo');
    const f = document.getElementById('fecha');
    const btn = document.querySelector('.btn-action');

    if(!u.value || !e.value) {
        if(!u.value) u.style.borderColor = "var(--warning)";
        if(!e.value) e.style.borderColor = "var(--warning)";
        setTimeout(() => {
            u.style.borderColor = "var(--border)";
            e.style.borderColor = "var(--border)";
        }, 2000);
        return;
    }

    btn.innerHTML = "PROCESANDO...";
    btn.disabled = true;

    await new Promise(r => setTimeout(r, 800));

    const nuevo = {
        id_prestamo: Math.floor(Math.random() * 9000) + 1000,
        equipo: e.value,
        usuario: u.value,
        estado: "En Uso",
        vencimiento: f.value
    };

    prestamosData.unshift(nuevo);
    
    u.value = ''; e.value = ''; f.value = '';
    btn.innerHTML = "Registrar Salida";
    btn.disabled = false;
    
    cargar();
}

window.onload = () => {
    cargar();
    cargarEquipos();
};
</script>

</body>
</html>
